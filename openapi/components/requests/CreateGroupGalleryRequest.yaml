title: CreateGroupGalleryRequest
type: object
properties:
  description:
    type: string
    description: Description of the gallery.
    examples:
      - Example Description
    minLength: 0
  membersOnly:
    type: boolean
    description: Whether the gallery is members only.
    default: false
    examples:
      - false
  name:
    type: string
    description: Name of the gallery.
    examples:
      - Example Gallery
    minLength: 1
  roleIdsToAutoApprove:
    type: [array, "null"]
    items:
      $ref: ../schemas/GroupRoleID.yaml
  roleIdsToManage:
    type: [array, "null"]
    items:
      $ref: ../schemas/GroupRoleID.yaml
  roleIdsToSubmit:
    type: [array, "null"]
    items:
      $ref: ../schemas/GroupRoleID.yaml
  roleIdsToView:
    type: [array, "null"]
    items:
      $ref: ../schemas/GroupRoleID.yaml
required:
  - name
