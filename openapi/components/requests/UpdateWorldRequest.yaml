title: UpdateWorldRequest
type: object
properties:
  assetUrl:
    type: string
    minLength: 1
  assetVersion:
    type: string
    minLength: 1
  authorId:
    $ref: ../schemas/UserID.yaml
  authorName:
    type: string
    minLength: 1
  capacity:
    type: integer
    example: 8
    maximum: 40
    minimum: 0
  description:
    type: string
  disabledPropAbilities:
    type: array
    items:
      type: string
  imageUrl:
    type: string
    minLength: 1
  name:
    type: string
    minLength: 1
  platform:
    $ref: ../schemas/Platform.yaml
  previewYoutubeId:
    type: string
    nullable: true
  recommendedCapacity:
    type: integer
    example: 4
  releaseStatus:
    $ref: ../schemas/ReleaseStatus.yaml
  urlList:
    type: array
    items:
      type: string
  tags:
    type: array
    description: " "
    items:
      $ref: ../schemas/Tag.yaml
  unityPackageUrl:
    type: string
    minLength: 1
  unityVersion:
    type: string
    default: 5.3.4p1
    example: 2022.3.6f1
    minLength: 1
