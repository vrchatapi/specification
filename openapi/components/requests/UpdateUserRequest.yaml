title: UpdateUserRequest
type: object
properties:
  acceptedTOSVersion:
    type: integer
  allowAvatarCopying:
    type: boolean
  allowWorldsToCountFriendsInInstance:
    type: boolean
    description: 'The "Allow Worlds to Count Friends in Instance" setting, introduced under [Udon Methods for Friend Info](https://ask.vrchat.com/t/developer-update-24-september-2026/48972#p-90922-udon-methods-for-friend-info-13) in the Developer Update of September 24, 2026.'
  birthday:
    type: string
    format: date
  contentFilters:
    type: array
    description: These tags begin with `content_` and control content gating
    items:
      $ref: ../schemas/ContentFilter.yaml
  currentPassword:
    type: string
  displayName:
    type: string
    description: MUST specify currentPassword as well to change display name
  email:
    type: string
  hasDiscordFriendsOptOut:
    type: boolean
    description: Opt out of the Discord Friend Connections feature
  hasSharedConnectionsOptOut:
    type: boolean
    description: Opt out of the Mutuals feature
  homeLocation:
    $ref: ../schemas/WorldID.yaml
  isBoopingEnabled:
    type: boolean
  password:
    type: string
    description: MUST specify currentPassword as well to change password
  pronouns:
    type: string
    maxLength: 32
    minLength: 0
  revertDisplayName:
    type: boolean
    description: MUST specify currentPassword as well to revert display name
  status:
    $ref: ../schemas/UserStatus.yaml
  statusDescription:
    type: string
  tags:
    type: array
    items:
      $ref: ../schemas/Tag.yaml
  unsubscribe:
    type: boolean
