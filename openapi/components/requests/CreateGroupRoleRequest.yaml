title: CreateGroupRequest
type: object
properties:
  description:
    type: string
  id:
    type: string
  isAddedOnJoin:
    type: boolean
    default: false
  isSelfAssignable:
    type: boolean
    default: false
  name:
    type: string
  permissions:
    type: array
    items:
      $ref: ../schemas/GroupPermissions.yaml
  requiresPurchase:
    type: boolean
    default: false
  requiresTwoFactor:
    type: boolean
    default: false
