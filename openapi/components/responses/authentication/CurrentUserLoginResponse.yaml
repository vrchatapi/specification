content:
  application/json:
    schema:
      title: CurrentUserLoginResponse
      oneOf:
        - $ref: ../../schemas/CurrentUser.yaml
        - $ref: ../../schemas/RequiresTwoFactorAuth.yaml
headers:
  Set-Cookie:
    description: Successful authentication returns an `auth` cookie.
    schema:
      type: string
      examples:
        - "auth=authcookie_00000000-0000-0000-0000-000000000000; Expires=Tue, 01 Jan 2030 00:00:00 GMT; Path=/; HttpOnly"
