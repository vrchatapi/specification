description: >-
  The request body failed validation. VRChat validates the payload before it
  looks the resource up, so this is returned even when the id in the path does
  not exist. The message names the offending field.
content:
  application/json:
    examples:
      Invalid Field:
        value:
          error:
            message: "imageUrl must be a URL˸ 'string'‚ assetUrl must be a URL˸ 'string'"
            status_code: 400
    schema:
      $ref: ../schemas/Error.yaml
