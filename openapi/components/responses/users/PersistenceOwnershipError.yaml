description: >-
  Error response when asking about another user's persistence data. The body
  carries only a message string, without the nested `error` object every other
  response in this description uses.
content:
  application/json:
    examples:
      Not Your Persistence:
        value:
          error: You're not who I was expecting!
    schema:
      $ref: ../../schemas/BareError.yaml
