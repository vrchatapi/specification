title: RouteNotImplemented
type: object
description: >-
  The body VRChat returns for a route it does not serve. The shape differs from
  every other error in this description: `error` is a string here, not an
  `Error` object with `message` and `status_code` inside it.
properties:
  error:
    type: string
    enum:
      - The endpoint you're looking for is not implemented by our system.
  status_code:
    type: integer
    enum:
      - 404
required:
  - error
  - status_code
