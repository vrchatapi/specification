title: World
type: object
properties:
  authorId:
    $ref: ./UserID.yaml
  authorName:
    type: string
    minLength: 1
  capacity:
    type: integer
    examples:
      - 8
  created_at:
    type: string
    format: date-time
  defaultContentSettings:
    $ref: ./InstanceContentSettings.yaml
  description:
    type: string
    minLength: 0
  disabledPropAbilities:
    type: array
    items: {}
  favorites:
    type: integer
    default: 0
    examples:
      - 12024
    minimum: 0
  featured:
    type: boolean
    default: false
  heat:
    type: integer
    default: 0
    examples:
      - 5
    minimum: 0
  id:
    $ref: ./WorldID.yaml
  imageUrl:
    type: string
    minLength: 1
  instances:
    type: array
    description: Will always be an empty list when unauthenticated.
    items:
      type: array
      description: |-
        A fixed triple of instance id, occupant count, and the share of
        occupants per language code. OpenAPI 3.0 cannot type the positions
        individually, so the members are only bounded by length.
      items: {}
      maxItems: 3
      minItems: 3
  isHypeTrainEligible:
    type: boolean
  labsPublicationDate:
    type: string
    examples:
      - none
    minLength: 1
  name:
    type: string
    minLength: 0
  namespace:
    type: string
  occupants:
    type: integer
    description: Will always be `0` when unauthenticated.
    default: 0
    examples:
      - 47
    minimum: 0
  organization:
    type: string
    default: vrchat
    minLength: 1
  popularity:
    type: integer
    default: 0
    examples:
      - 8
    minimum: 0
  previewYoutubeId:
    type: ["null", string]
  privateOccupants:
    type: integer
    description: Will always be `0` when unauthenticated.
    default: 0
    examples:
      - 1
    minimum: 0
  publicOccupants:
    type: integer
    description: Will always be `0` when unauthenticated.
    default: 0
    examples:
      - 46
    minimum: 0
  publicationDate:
    type: string
    examples:
      - none
    minLength: 1
  recommendedCapacity:
    type: integer
    examples:
      - 4
  releaseStatus:
    $ref: ./ReleaseStatus.yaml
  slimInstances:
    type: array
    items: {}
  storeId:
    $ref: ./StoreID.yaml
  tags:
    type: array
    items:
      $ref: ./Tag.yaml
  thumbnailImageUrl:
    type: string
    minLength: 1
  udonProducts:
    type: array
    items:
      $ref: ./UdonProductId.yaml
  unityPackages:
    type: array
    description: Empty if unauthenticated.
    items:
      $ref: ./UnityPackage.yaml
  updated_at:
    type: string
    format: date-time
  urlList:
    type: array
    items:
      type: string
  version:
    type: integer
    default: 0
    examples:
      - 68
    minimum: 0
  visits:
    type: integer
    default: 0
    examples:
      - 9988675
    minimum: 0
required:
  - authorId
  - authorName
  - capacity
  - created_at
  - description
  - featured
  - heat
  - id
  - imageUrl
  - labsPublicationDate
  - name
  - organization
  - popularity
  - publicationDate
  - recommendedCapacity
  - releaseStatus
  - tags
  - thumbnailImageUrl
  - updated_at
  - version
  - visits
