title: Notification
type: object
description: ""
properties:
  created_at:
    type: string
    format: date-time
  details:
    type: string
    description: "**NOTICE:** This is not a JSON object when received from the REST API, but it is when received from the Websocket API. When received from the REST API, this is a json **encoded** object, meaning you have to json-de-encode to get the NotificationDetail object depending on the NotificationType."
    default: "{}"
    example: "OneOf: {}, NotificationDetailBoop, NotificationDetailInvite, NotificationDetailInviteResponse, NotificationDetailRequestInvite, NotificationDetailRequestInviteResponse, NotificationDetailVoteToKick"
  id:
    type: string
    minLength: 1
  message:
    type: string
    description: ""
    example: This is a generated invite to VRChat Hub
  receiverUserId:
    $ref: ./UserID.yaml
    description: Not included in notification objects received from the REST API
  seen:
    type: boolean
    description: Not included in notification objects received from the Websocket API
    default: false
  senderUserId:
    $ref: ./UserID.yaml
  senderUsername:
    type: string
    description: The name of the user who sent the notification.
    nullable: true
    minLength: 1
  type:
    $ref: ./NotificationType.yaml
required:
  - created_at
  - details
  - id
  - message
  - senderUserId
  - type
