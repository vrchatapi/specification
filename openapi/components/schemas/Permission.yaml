title: Permission
type: object
properties:
  data:
    $ref: ./PermissionData.yaml
    description: Specific values afforded the user by this permission
  description:
    type: string
  displayName:
    type: string
  id:
    $ref: ./PermissionID.yaml
  name:
    type: string
    examples:
      - permission-invite-photos
    minLength: 1
  ownerDisplayName:
    type: string
  ownerId:
    $ref: ./UserID.yaml
  type:
    type: string
required:
  - id
  - name
  - ownerDisplayName
  - ownerId
