title: User
type: object
properties:
  acceptedPrivacyVersion:
    type: integer
  acceptedTOSVersion:
    type: integer
  accountDeletionDate:
    type: string
    nullable: true
  accountDeletionLog:
    type: array
    nullable: true
    items: {}
  ageVerificationStatus:
    $ref: ./AgeVerificationStatus.yaml
  ageVerified:
    $ref: ./AgeVerified.yaml
  allowAvatarCopying:
    type: boolean
    default: true
  appleDetails:
    $ref: ./ConnectedAccountDetails.yaml
  bannerColor:
    $ref: ./Color.yaml
  bannerType:
    type: string
  bannerUrl:
    type: string
  date_joined:
    type: string
    format: date
  developerType:
    $ref: ./DeveloperType.yaml
  displayName:
    type: string
    description: "A users visual display name. This is what shows up in-game, and can different from their `username`. Changing display name is restricted to a cooldown period."
  friendKey:
    type: string
  friendRequestStatus:
    $ref: ./FriendRequestStatus.yaml
  iconFrame:
    type: string
  iconUrl:
    type: string
  id:
    $ref: ./UserID.yaml
  instanceId:
    $ref: ./InstanceID.yaml
  isEconomyCreator:
    type: boolean
  isFriend:
    type: boolean
    description: "Either their `friendKey`, or empty string if you are not friends. Unknown usage."
  last_activity:
    type: string
    description: Either a date-time or empty string.
  last_login:
    type: string
    description: Either a date-time or empty string.
  last_mobile:
    type: string
    nullable: true
  last_platform:
    $ref: ./Platform.yaml
  location:
    $ref: ./LocationID.yaml
  nameplateEffect:
    type: string
  note:
    type: string
  platform:
    type: string
  profileEffect:
    type: string
  pronouns:
    type: string
  state:
    $ref: ./UserState.yaml
  status:
    $ref: ./UserStatus.yaml
  statusDescription:
    type: string
  tags:
    type: array
    description: " "
    items:
      $ref: ./Tag.yaml
  travelingToInstance:
    type: string
  travelingToLocation:
    type: string
  travelingToWorld:
    type: string
  worldId:
    $ref: ./WorldID.yaml
required:
  - ageVerificationStatus
  - ageVerified
  - allowAvatarCopying
  - date_joined
  - developerType
  - displayName
  - friendKey
  - id
  - isFriend
  - last_activity
  - last_login
  - last_platform
  - pronouns
  - state
  - status
  - statusDescription
  - tags
