title: MutualFriend
type: object
description: User object received when querying mutual friends
properties:
  bannerColor:
    type: string
    description: Hex colour without a leading `#`.
    example: 3cc92c
  bannerType:
    type: string
    example: color
  displayName:
    type: string
  iconFrame:
    type: string
  iconUrl:
    type: string
  id:
    $ref: ./UserID.yaml
  nameplateEffect:
    type: string
  profileEffect:
    type: string
  status:
    $ref: ./UserStatus.yaml
  statusDescription:
    type: string
required:
  - displayName
  - id
  - status
  - statusDescription
