title: MutualFriend
type: object
description: User object received when querying mutual friends
properties:
  avatarThumbnail:
    $ref: ./CurrentAvatarThumbnailImageUrl.yaml
  bannerColor:
    type: string
    description: Hex colour without a leading `#`.
    example: 3cc92c
  bannerType:
    type: string
    example: color
  currentAvatarImageUrl:
    $ref: ./CurrentAvatarImageUrl.yaml
  currentAvatarTags:
    type: array
    items:
      $ref: ./Tag.yaml
  currentAvatarThumbnailImageUrl:
    $ref: ./CurrentAvatarThumbnailImageUrl.yaml
  displayName:
    type: string
  iconFrame:
    type: string
  iconUrl:
    type: string
  id:
    $ref: ./UserID.yaml
  imageUrl:
    type: string
  nameplateEffect:
    type: string
  profileEffect:
    type: string
  profilePicOverride:
    type: string
  status:
    $ref: ./UserStatus.yaml
  statusDescription:
    type: string
required:
  - currentAvatarImageUrl
  - displayName
  - id
  - imageUrl
  - status
  - statusDescription
