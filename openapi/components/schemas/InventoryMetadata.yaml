title: InventoryMetadata
type: object
properties:
  animated:
    type: boolean
  animationStyle:
    type: string
  assetBundleId:
    type: string
  assets:
    type: array
    items:
      $ref: ./InventoryAsset.yaml
  fileId:
    type: string
  gradientEnd:
    type: string
    description: Hex colour without a leading `#`.
  gradientStart:
    type: string
    description: Hex colour without a leading `#`.
  imageUrl:
    type: string
  inventoryItemsToInstantiate:
    type: array
    description: Only in bundles
    items:
      $ref: ./InventoryTemplateID.yaml
  maskTag:
    type: string
  propId:
    $ref: ./PropID.yaml
  propKind:
    type: integer
  viewfinderBundleId:
    type: string
