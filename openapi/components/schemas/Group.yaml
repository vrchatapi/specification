title: Group
type: object
properties:
  ageVerificationBetaCode:
    type: string
    examples:
      - abc1234
  ageVerificationBetaSlots:
    type: number
    examples:
      - 500
  ageVerificationSlotsAvailable:
    type: boolean
  allowGroupJoinPrompt:
    type: boolean
  badges:
    type: array
    items:
      type: string
  bannerId:
    type: ["null", string]
  bannerUrl:
    type: ["null", string]
  createdAt:
    type: string
    format: date-time
  description:
    type: string
  discriminator:
    $ref: ./GroupDiscriminator.yaml
  galleries:
    type: array
    items:
      $ref: ./GroupGallery.yaml
  iconId:
    type: ["null", string]
  iconUrl:
    type: ["null", string]
  id:
    $ref: ./GroupID.yaml
  isVerified:
    type: boolean
    default: false
  joinState:
    $ref: ./GroupJoinState.yaml
  languages:
    type: array
    items:
      type: string
  lastPostCreatedAt:
    type: ["null", string]
    format: date-time
  links:
    type: array
    items:
      type: string
  memberCount:
    type: integer
  memberCountSyncedAt:
    type: string
    format: date-time
  membershipStatus:
    $ref: ./GroupMemberStatus.yaml
  myMember:
    anyOf:
      - $ref: ./GroupMyMember.yaml
      - type: "null"
  name:
    type: string
  nameplateId: {}
  nameplateUrl: {}
  onlineMemberCount:
    type: integer
  ownerId:
    $ref: ./UserID.yaml
  privacy:
    $ref: ./GroupPrivacy.yaml
  roles:
    type: [array, "null"]
    description: Only returned if ?includeRoles=true is specified.
    items:
      $ref: ./GroupRole.yaml
  rules:
    type: ["null", string]
  shortCode:
    $ref: ./GroupShortCode.yaml
  storeId:
    anyOf:
      - $ref: ./StoreID.yaml
      - type: "null"
  tags:
    type: array
    items:
      $ref: ./Tag.yaml
  transferTargetId:
    anyOf:
      - $ref: ./UserID.yaml
      - type: "null"
  updatedAt:
    type: string
    format: date-time
