  accountId:
    type: [integer, "null"]
  accountSellerRegisteredOn:
    type: ["null", string]
    format: date-time
  accountSellerStatus:
    type: ["null", string]
  blocked:
    type: boolean
  canEarn:
    type: boolean
  canPayout:
    type: boolean
  canSpend:
    type: boolean
  limits:
    $ref: ./EconomyAccountLimits.yaml
  skrillEmail:
    type: ["null", string]
  source:
