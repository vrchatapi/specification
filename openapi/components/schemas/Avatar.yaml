title: Avatar
type: object
properties:
  acknowledgements:
    type: string
  activeAssetReviewId:
    type: string
    description: Only present for the avatar author on avatars under active review.
  assetUrl:
    type: string
    description: "Not present from general search `/avatars`, only on specific requests `/avatars/{avatarId}`."
    minLength: 1
  assetUrlObject:
    $ref: ./AvatarAssetURLObject.yaml
    description: |-
      Not present from general search `/avatars`, only on specific requests `/avatars/{avatarId}`.
      **Deprecation:** `Object` has unknown usage/fields, and is always empty. Use normal `Url` field instead.
  attribution:
    $ref: ./Unknown.yaml
  authorId:
    $ref: ./UserID.yaml
  authorName:
    type: string
    minLength: 1
  created_at:
    type: string
    format: date-time
  description:
    type: string
    minLength: 0
  featured:
    type: boolean
    default: false
  highestPrice:
    type: integer
  id:
    $ref: ./AvatarID.yaml
  imageUrl:
    type: string
    minLength: 1
  listingDate:
    type:
      - string
      - "null"
  lock:
    type: boolean
  lowestPrice:
    type: integer
  name:
    type: string
    minLength: 1
  pendingUpload:
    type: boolean
    default: false
  performance:
    $ref: ./AvatarPerformance.yaml
  productId:
    type: string
  publishedListings:
    type: array
    items:
      $ref: ./AvatarPublishedListing.yaml
  releaseStatus:
    $ref: ./ReleaseStatus.yaml
  searchable:
    type: boolean
    default: false
  styles:
    $ref: ./AvatarStyles.yaml
  tags:
    type: array
    items:
      $ref: ./Tag.yaml
  thumbnailImageUrl:
    type: string
    minLength: 1
  unityPackageUrl:
    type: string
  unityPackageUrlObject:
    deprecated: true
    $ref: ./AvatarUnityPackageURLObject.yaml
    description: "**Deprecation:** `Object` has unknown usage/fields, and is always empty. Use normal `Url` field instead."
  unityPackages:
    type: array
    items:
      $ref: ./UnityPackage.yaml
    minItems: 1
    uniqueItems: true
  updated_at:
    type: string
    format: date-time
  version:
    type: integer
    default: 0
    examples:
      - 68
    minimum: 0
required:
  - authorId
  - authorName
  - created_at
  - description
  - featured
  - id
  - imageUrl
  - listingDate
  - name
  - performance
  - releaseStatus
  - styles
  - tags
  - thumbnailImageUrl
  - unityPackageUrl
  - unityPackageUrlObject
  - unityPackages
  - updated_at
  - version
