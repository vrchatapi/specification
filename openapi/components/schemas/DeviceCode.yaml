title: DeviceCode
type: object
description: A code that logs the device that created it in, once a logged-in user approves it with `approveDeviceAuth`.
properties:
  deviceCode:
    type: string
    description: Identifies this login attempt to `checkDeviceCode`.
  expiresIn:
    type: integer
  interval:
    type: integer
  userCode:
    type: string
    description: Identifies this login attempt to `getDeviceAuthInfo` and `approveDeviceAuth`.
  verificationUrl:
    type: string
    format: uri
  verificationUrlComplete:
    type: string
    description: "`verificationUrl` with the code already filled in."
    format: uri
required:
  - deviceCode
  - expiresIn
  - interval
  - userCode
  - verificationUrl
  - verificationUrlComplete
