title: LimitedWorld
type: object
properties:
  authorId:
    $ref: ./UserID.yaml
  authorName:
    type: string
    minLength: 1
  capacity:
    type: integer
    examples:
      - 8
  created_at:
    type: string
    format: date-time
  defaultContentSettings:
    $ref: ./InstanceContentSettings.yaml
  disabledPropAbilities:
    type: array
    items: {}
  favorites:
    type: integer
    default: 0
    examples:
      - 12024
    minimum: 0
  heat:
    type: integer
    default: 0
    examples:
      - 5
    minimum: 0
  id:
    $ref: ./WorldID.yaml
  imageUrl:
    type: string
    minLength: 1
  isHypeTrainEligible:
    type: boolean
  labsPublicationDate:
    type: string
    examples:
      - none
    minLength: 1
  name:
    type: string
    minLength: 1
  occupants:
    type: integer
    default: 0
    examples:
      - 47
    minimum: 0
  organization:
    type: string
    default: vrchat
    minLength: 1
  pendingUpload:
    type: boolean
  popularity:
    type: integer
    default: 0
    examples:
      - 8
    minimum: 0
  previewYoutubeId:
    type:
      - string
      - "null"
  publicationDate:
    type: string
    examples:
      - none
    minLength: 1
  recommendedCapacity:
    type: integer
    examples:
      - 16
  releaseStatus:
    $ref: ./ReleaseStatus.yaml
  storeId:
    $ref: ./StoreID.yaml
  tags:
    type: array
    items:
      $ref: ./Tag.yaml
  thumbnailImageUrl:
    type: string
    minLength: 1
  udonProducts:
    type: array
    items:
      $ref: ./UdonProductId.yaml
  unityPackages:
    type: array
    items:
      $ref: ./LimitedUnityPackage.yaml
    minItems: 1
  updated_at:
    type: string
    format: date-time
  visits:
    type: integer
    default: 0
    examples:
      - 9988675
    minimum: 0
required:
  - authorId
  - authorName
  - capacity
  - created_at
  - favorites
  - heat
  - id
  - imageUrl
  - labsPublicationDate
  - name
  - occupants
  - organization
  - popularity
  - publicationDate
  - releaseStatus
  - tags
  - thumbnailImageUrl
  - unityPackages
  - updated_at
