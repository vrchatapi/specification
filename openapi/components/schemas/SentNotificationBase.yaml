title: SentNotificationBase
type: object
properties:
  created_at:
    type: string
    format: date-time
  id:
    type: string
    minLength: 1
  message:
    type: string
    examples:
      - This is a generated invite to VRChat Hub
  receiverUserId:
    $ref: ./UserID.yaml
  senderUserId:
    $ref: ./UserID.yaml
  senderUsername:
    type: string
    description: The name of the user who sent the notification.
    minLength: 1
required:
  - created_at
  - id
  - message
  - receiverUserId
  - senderUserId
