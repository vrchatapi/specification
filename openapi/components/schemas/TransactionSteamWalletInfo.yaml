title: TransactionSteamWalletInfo
type: object
properties:
  country:
    type: string
    default: US
    examples:
      - SE
    minLength: 2
  currency:
    type: string
    default: USD
    examples:
      - EUR
    minLength: 3
  state:
    type: string
  status:
    type: string
    examples:
      - Trusted
    minLength: 1
required:
  - country
  - currency
  - state
  - status
examples:
  - country: SE
    currency: EUR
    state: ""
    status: Trusted
