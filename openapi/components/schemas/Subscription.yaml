title: Subscription
type: object
properties:
  amount:
    type: number
  appleProductId:
    type: string
    minLength: 1
  bulkSize:
    type: integer
    description: How many subscriptions a gifted bundle grants.
    examples:
      - 5
  description:
    type: string
  discountPercentage:
    type: integer
    description: Discount applied to a gifted bundle.
    examples:
      - 10
  googlePlanId:
    type: string
  googleProductId:
    type: string
    minLength: 1
  id:
    type: string
    minLength: 1
  oculusSku:
    type: string
    minLength: 1
  period:
    $ref: ./SubscriptionPeriod.yaml
  periodAmount:
    $ref: ./Unknown.yaml
  picoSku:
    type: string
    minLength: 1
  steamItemId:
    type: string
    minLength: 1
  tier:
    type: integer
required:
  - amount
  - description
  - id
  - period
  - steamItemId
  - tier
examples:
  - id: vrchatplus-yearly
    description: VRChat Plus (Yearly)
    amount: 9999
    period: year
    steamItemId: "5000"
    tier: 5
