title: SentNotification
description: A notification as its sender receives it back. The shape of `details` depends on `type`.
discriminator:
  defaultMapping: ./SentNotificationUnknown.yaml
  mapping:
    boop: ./SentNotificationBoop.yaml
    friendRequest: ./SentNotificationFriendRequest.yaml
    invite: ./SentNotificationInvite.yaml
    inviteResponse: ./SentNotificationInviteResponse.yaml
    message: ./SentNotificationMessage.yaml
    requestInvite: ./SentNotificationRequestInvite.yaml
    requestInviteResponse: ./SentNotificationRequestInviteResponse.yaml
    votetokick: ./SentNotificationVoteToKick.yaml
  propertyName: type
oneOf:
  - $ref: ./SentNotificationBoop.yaml
  - $ref: ./SentNotificationFriendRequest.yaml
  - $ref: ./SentNotificationInvite.yaml
  - $ref: ./SentNotificationInviteResponse.yaml
  - $ref: ./SentNotificationMessage.yaml
  - $ref: ./SentNotificationRequestInvite.yaml
  - $ref: ./SentNotificationRequestInviteResponse.yaml
  - $ref: ./SentNotificationVoteToKick.yaml
  - $ref: ./SentNotificationUnknown.yaml
