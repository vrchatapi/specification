title: GroupAuditLogEntryDataGroupRole
type: object
properties:
  description:
    type: string
    description: The role description.
  isAddedOnJoin:
    type: boolean
    description: Whether the role is automatically assigned on join.
  isSelfAssignable:
    type: boolean
    description: Whether users can self-assign this role.
  name:
    type: string
    description: The role name.
  order:
    type: integer
    description: The display order of the role.
  permissions:
    type: array
    description: The permissions assigned to this role.
    items:
      $ref: ./GroupPermissions.yaml
  requiresPurchase:
    type: boolean
    description: Whether the role requires a purchase.
  requiresTwoFactor:
    type: boolean
    description: Whether the role requires two-factor authentication.
required:
  - description
  - isAddedOnJoin
  - isSelfAssignable
  - name
  - permissions
  - requiresPurchase
  - requiresTwoFactor
