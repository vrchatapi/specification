title: CalendarEvent
type: object
description: "An event scheduled on a group's calendar"
properties:
  accessType:
    $ref: ./CalendarEventAccess.yaml
  category:
    $ref: ./CalendarEventCategory.yaml
  closeInstanceAfterEndMinutes:
    type: integer
  createdAt:
    type: string
    format: date-time
  deletedAt:
    type: ["null", string]
    format: date-time
  description:
    type: string
  durationInMs:
    type: integer
    format: int64
  endsAt:
    type: string
    format: date-time
  featured:
    type: boolean
  guestEarlyJoinMinutes:
    type: integer
  hostEarlyJoinMinutes:
    type: integer
  id:
    $ref: ./CalendarID.yaml
  imageId:
    anyOf:
      - $ref: ./FileID.yaml
      - type: "null"
  imageUrl:
    type: string
  interestedUserCount:
    type: integer
  isDraft:
    type: boolean
  languages:
    type: array
    description: Languages that might be spoken at this event
    items:
      $ref: ./LanguageCode.yaml
  occurrenceKind:
    $ref: ./CalendarEventOccurrenceKind.yaml
  occurrenceModified:
    type: boolean
  ownerId:
    $ref: ./GroupID.yaml
  platforms:
    type: array
    items:
      $ref: ./CalendarEventPlatform.yaml
  recurrence:
    $ref: ./CalendarEventRecurrence.yaml
  roleIds:
    type: [array, "null"]
    description: Group roles that may join this event
    items:
      $ref: ./GroupRoleID.yaml
  seriesId:
    anyOf:
      - $ref: ./CalendarID.yaml
      - type: "null"
  startsAt:
    type: string
    format: date-time
  tags:
    type: array
    description: Custom tags for this event
    items:
      $ref: ./Tag.yaml
  title:
    type: string
    minLength: 1
  type:
    type: string
    example: event
  updatedAt:
    type: string
    format: date-time
  userInterest:
    $ref: ./CalendarEventUserInterest.yaml
  usesInstanceOverflow:
    type: boolean
required:
  - accessType
  - category
  - description
  - endsAt
  - id
  - startsAt
  - title
