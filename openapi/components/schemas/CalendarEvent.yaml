title: CalendarEvent
type: object
description: "An event scheduled on a group's calendar"
properties:
  accessType:
    $ref: ./CalendarEventAccess.yaml
  category:
    $ref: ./CalendarEventCategory.yaml
  closeInstanceAfterEndMinutes:
    type: integer
  createdAt:
    type: string
    format: date-time
  deletedAt:
    type:
      - string
      - "null"
    format: date-time
  description:
    type: string
  durationInMs:
    type: integer
    format: int64
  endsAt:
    type: string
    format: date-time
  featured:
    type: boolean
  guestEarlyJoinMinutes:
    type: integer
  hostEarlyJoinMinutes:
    type: integer
  id:
    $ref: ./CalendarID.yaml
  imageId:
    anyOf:
      - $ref: ./FileID.yaml
      - type: "null"
  imageUrl:
    type: string
  interestedFriendCount:
    type: integer
  interestedUserCount:
    type: integer
  isDraft:
    type: boolean
  languages:
    type: array
    description: Languages that might be spoken at this event
    items:
      $ref: ./LanguageCode.yaml
  linkedInstanceCount:
    type: integer
  occurrenceKind:
    $ref: ./CalendarEventOccurrenceKind.yaml
  occurrenceModified:
    type: boolean
  ownerIconUrl:
    type: string
    description: The icon of the group `ownerId` names.
    examples:
      - https://api.vrchat.cloud/api/1/image/file_4b6faa09-b491-450a-bad6-3cc431184e46/1/512
  ownerId:
    $ref: ./GroupID.yaml
  ownerName:
    type: string
    description: The `name` of the group `ownerId` names.
  platforms:
    type: array
    items:
      $ref: ./CalendarEventPlatform.yaml
  recurrence:
    anyOf:
      - $ref: ./CalendarEventRecurrence.yaml
      - type: "null"
  roleIds:
    type:
      - array
      - "null"
    description: Group roles that may join this event
    items:
      $ref: ./GroupRoleID.yaml
  seriesId:
    anyOf:
      - $ref: ./CalendarID.yaml
      - type: "null"
  startsAt:
    type: string
    format: date-time
  tags:
    type: array
    description: Custom tags for this event
    items:
      $ref: ./Tag.yaml
  title:
    type: string
    minLength: 1
  type:
    type: string
    examples:
      - event
  updatedAt:
    type: string
    format: date-time
  userInterest:
    $ref: ./CalendarEventUserInterest.yaml
  usesInstanceOverflow:
    type: boolean
required:
  - accessType
  - category
  - description
  - endsAt
  - id
  - startsAt
  - title
