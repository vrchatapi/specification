title: Jam
type: object
properties:
  created_at:
    type: string
    format: date-time
  description:
    type: string
    minLength: 1
  id:
    $ref: ./JamID.yaml
  isVisible:
    type: boolean
  moreInfo:
    type: string
    minLength: 1
  state:
    type: string
    description: |-
      One of:
      - submissions_open
      - closed
    minLength: 1
  stateChangeDates:
    type: object
    properties:
      closed:
        type: ["null", string]
        format: date-time
      submissionsClosed:
        type: ["null", string]
        format: date-time
      submissionsOpened:
        type: ["null", string]
        format: date-time
      winnersSelected:
        type: ["null", string]
        examples:
          - null
        format: date-time
  submissionContentGateDate:
    type: ["null", string]
    format: date-time
  submissionContentGated:
    type: boolean
  title:
    type: string
    minLength: 1
  type:
    type: string
  updated_at:
    type: string
    format: date-time
required:
  - description
  - id
  - isVisible
  - moreInfo
  - state
  - stateChangeDates
  - submissionContentGateDate
  - submissionContentGated
  - title
  - type
  - updated_at
