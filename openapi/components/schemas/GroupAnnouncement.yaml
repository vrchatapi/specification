title: GroupAnnouncement
type: object
description: >-
  An announcement is stored as a group post, so `POST /groups/{groupId}/announcement`
  answers with the post fields below as well as the announcement ones.
properties:
  authorId:
    type: [./UserID.yaml, "null"]
  createdAt:
    type: ["null", string]
    format: date-time
  editorId:
    type: [./UserID.yaml, "null"]
  groupId:
    type: [./GroupID.yaml, "null"]
  id:
    type: [./GroupAnnouncementID.yaml, "null"]
  imageId:
    type: [./FileID.yaml, "null"]
  imageUrl:
    type: ["null", string]
  roleIds:
    $ref: ./GroupRoleIDList.yaml
  text:
    type: ["null", string]
  title:
    type: ["null", string]
  updatedAt:
    type: ["null", string]
    format: date-time
  visibility:
    type: string
