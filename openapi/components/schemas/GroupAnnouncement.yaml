title: GroupAnnouncement
type: object
description: >-
  An announcement is stored as a group post, so `POST /groups/{groupId}/announcement`
  answers with the post fields below as well as the announcement ones.
properties:
  authorId:
    $ref: ./UserID.yaml
    nullable: true
  editorId:
    $ref: ./UserID.yaml
    nullable: true
  createdAt:
    type: string
    nullable: true
    format: date-time
  groupId:
    $ref: ./GroupID.yaml
    nullable: true
  id:
    $ref: ./GroupAnnouncementID.yaml
    nullable: true
  imageId:
    $ref: ./FileID.yaml
    nullable: true
  imageUrl:
    type: string
    nullable: true
  roleIds:
    $ref: ./GroupRoleIDList.yaml
  text:
    type: string
    nullable: true
  title:
    type: string
    nullable: true
  updatedAt:
    type: string
    nullable: true
    format: date-time
  visibility:
    type: string
