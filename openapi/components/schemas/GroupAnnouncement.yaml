title: GroupAnnouncement
type: object
description: >-
  An announcement is stored as a group post, so `POST /groups/{groupId}/announcement`
  answers with the post fields below as well as the announcement ones.
properties:
  authorId:
    anyOf:
      - $ref: ./UserID.yaml
      - type: "null"
  createdAt:
    type: ["null", string]
    format: date-time
  editorId:
    anyOf:
      - $ref: ./UserID.yaml
      - type: "null"
  groupId:
    anyOf:
      - $ref: ./GroupID.yaml
      - type: "null"
  id:
    anyOf:
      - $ref: ./GroupAnnouncementID.yaml
      - type: "null"
  imageId:
    anyOf:
      - $ref: ./FileID.yaml
      - type: "null"
  imageUrl:
    type: ["null", string]
  roleIds:
    $ref: ./GroupRoleIDList.yaml
  text:
    type: ["null", string]
  title:
    type: ["null", string]
  updatedAt:
    type: ["null", string]
    format: date-time
  visibility:
    type: string
