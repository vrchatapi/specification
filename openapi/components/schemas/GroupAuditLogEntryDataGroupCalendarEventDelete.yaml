title: GroupAuditLogEntryDataGroupCalendarEventDelete
type: object
description: Data for group.calendarEvent.delete events.
properties:
  accessType:
    $ref: ./CalendarEventAccess.yaml
  category:
    type: string
    description: The category of the event.
  closeInstanceAfterEndMinutes:
    type: integer
    description: Minutes after event end to close the instance.
  createdAt:
    type: string
    description: The creation timestamp.
    format: date-time
  deletedAt:
    type:
      - string
      - "null"
    description: The deletion timestamp.
    format: date-time
  description:
    type: string
    description: The event description.
  durationInMs:
    type: integer
    description: The duration of the event in milliseconds.
  endsAt:
    type: string
    description: The end timestamp.
    format: date-time
  featured:
    type: boolean
    description: Whether the event is featured.
  guestEarlyJoinMinutes:
    type: integer
    description: Minutes before start that guests can join.
  hostEarlyJoinMinutes:
    type: integer
    description: Minutes before start that hosts can join.
  imageId:
    description: The image file ID.
    anyOf:
      - $ref: ./FileID.yaml
      - type: "null"
  interestedUserCount:
    type: integer
    description: The number of interested users.
  isDraft:
    type: boolean
    description: Whether the event is a draft.
  languages:
    type: array
    description: The languages for the event.
    items:
      type: string
  occurrenceKind:
    $ref: ./CalendarEventOccurrenceKind.yaml
  occurrenceModified:
    type:
      - string
      - "null"
    description: The occurrence modified timestamp.
  ownerId:
    $ref: ./GroupID.yaml
    description: The owner group ID.
  platforms:
    type: array
    description: The supported platforms.
    items:
      type: string
  recurrence:
    description: The recurrence rule.
    anyOf:
      - $ref: ./CalendarEventRecurrence.yaml
      - type: "null"
  roleIds:
    description: The role IDs with access.
    anyOf:
      - type: array
        description: The role IDs with access.
        items:
          $ref: ./GroupRoleID.yaml
      - type: "null"
  seriesId:
    type:
      - string
      - "null"
    description: The series ID for recurring events.
  shortCode:
    type:
      - string
      - "null"
    description: The short code.
  startsAt:
    type: string
    description: The start timestamp.
    format: date-time
  tags:
    type: array
    description: The event tags.
    items:
      type: string
  title:
    type: string
    description: The event title.
  type:
    type: string
    description: The type of calendar entry.
  updatedAt:
    type: string
    description: The last update timestamp.
    format: date-time
  usesInstanceOverflow:
    type: boolean
    description: Whether the event uses instance overflow.
required:
  - accessType
  - category
  - closeInstanceAfterEndMinutes
  - createdAt
  - deletedAt
  - description
  - durationInMs
  - endsAt
  - featured
  - guestEarlyJoinMinutes
  - hostEarlyJoinMinutes
  - imageId
  - interestedUserCount
  - isDraft
  - languages
  - occurrenceKind
  - occurrenceModified
  - ownerId
  - platforms
  - recurrence
  - roleIds
  - seriesId
  - shortCode
  - startsAt
  - tags
  - title
  - type
  - updatedAt
  - usesInstanceOverflow
