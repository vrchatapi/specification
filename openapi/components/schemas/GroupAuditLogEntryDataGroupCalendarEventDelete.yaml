title: GroupAuditLogEntryDataGroupCalendarEventDelete
type: object
properties:
  category:
    type: string
    description: The category of the event.
  closeInstanceAfterEndMinutes:
    type: integer
    description: Minutes after the event ends to close the instance.
  createdAt:
    type: string
    description: The creation timestamp.
    format: date-time
  deletedAt:
    type:
      - string
      - "null"
    description: The deletion timestamp.
    format: date-time
  durationInMs:
    type: integer
    description: The duration of the event in milliseconds.
  endsAt:
    type: string
    description: The end timestamp.
    format: date-time
  featured:
    type: boolean
    description: Whether the event is featured.
  guestEarlyJoinMinutes:
    type: integer
    description: Minutes before the start that guests can join.
  hostEarlyJoinMinutes:
    type: integer
    description: Minutes before the start that hosts can join.
  interestedUserCount:
    type: integer
    description: The number of interested users.
  isDraft:
    type: boolean
    description: Whether the event is a draft.
  languages:
    type: array
    description: The languages for the event.
    items:
      type: string
  occurrenceKind:
    $ref: ./CalendarEventOccurrenceKind.yaml
  occurrenceModified:
    type:
      - string
      - "null"
  ownerId:
    $ref: ./GroupID.yaml
    description: The ID of the group that owns the event.
  platforms:
    type: array
    description: The supported platforms.
    items:
      type: string
  recurrence:
    description: The recurrence rule.
    anyOf:
      - $ref: ./CalendarEventRecurrence.yaml
      - type: "null"
  roleIds:
    type:
      - array
      - "null"
    description: Group roles that may join this event.
    items:
      $ref: ./GroupRoleID.yaml
  seriesId:
    type:
      - string
      - "null"
    description: The ID of the recurring series the event belongs to.
  shortCode:
    type:
      - string
      - "null"
    description: The short code.
  startsAt:
    type: string
    description: The start timestamp.
    format: date-time
  tags:
    type: array
    description: The event tags.
    items:
      type: string
  updatedAt:
    type: string
    description: The last update timestamp.
    format: date-time
  usesInstanceOverflow:
    type: boolean
    description: Whether the event uses instance overflow.
required:
  - category
  - closeInstanceAfterEndMinutes
  - createdAt
  - deletedAt
  - durationInMs
  - endsAt
  - featured
  - guestEarlyJoinMinutes
  - hostEarlyJoinMinutes
  - interestedUserCount
  - isDraft
  - languages
  - occurrenceKind
  - occurrenceModified
  - ownerId
  - platforms
  - recurrence
  - roleIds
  - seriesId
  - shortCode
  - startsAt
  - tags
  - updatedAt
  - usesInstanceOverflow
allOf:
  - $ref: ./GroupAuditLogEntryDataGroupCalendarEventCreate.yaml
