title: InstanceCategory
type: object
description: A category an instance can be listed under.
properties:
  deleted:
    type: boolean
  iconUrl:
    type: string
    examples:
      - vrchat://category_hangout
  id:
    $ref: ./InstanceCategoryID.yaml
  name:
    type: string
    examples:
      - Hangout
  order:
    type: integer
    examples:
      - 0
required:
  - deleted
  - iconUrl
  - id
  - name
  - order
