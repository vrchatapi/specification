# can probably done via pseudocode Omit<GroupRole.yaml, "isManagementRole", "updatedAt">
title: GroupAuditLogEntryDataGroupRoleCreate
type: object
description: Data for group.role.create events.
properties:
  description:
    type: string
    description: The role description.
  groupId:
    $ref: ./GroupID.yaml
    description: The group ID.
  isAddedOnJoin:
    type: boolean
    description: Whether the role is automatically assigned on join.
  isSelfAssignable:
    type: boolean
    description: Whether users can self-assign this role.
  lastUpdatedByUserId:
    $ref: ./UserID.yaml
    description: The ID of the user who last updated the role.
  name:
    type: string
    description: The role name.
  order:
    type: integer
    description: The display order of the role.
  permissions:
    type: array
    description: The permissions assigned to this role.
    items:
      type: string
  requiresPurchase:
    type: boolean
    description: Whether the role requires a purchase.
  requiresTwoFactor:
    type: boolean
    description: Whether the role requires two-factor authentication.
required:
  - description
  - groupId
  - isAddedOnJoin
  - isSelfAssignable
  - lastUpdatedByUserId
  - name
  - order
  - permissions
  - requiresPurchase
  - requiresTwoFactor
