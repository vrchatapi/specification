title: CurrentUserPresence
type: object
properties:
  avatarImageUrl:
    type: string
  avatarThumbnail:
    type: ["null", string]
  banner:
    type: string
  bannerColor:
    $ref: ./Color.yaml
  bannerType:
    type: string
  bannerUrl:
    type: string
  currentAvatarTags:
    type: string
  debugflag:
    type: string
  displayName:
    type: string
  groups:
    type: [array, "null"]
    items:
      $ref: ./GroupID.yaml
  iconFrame:
    type: string
  iconUrl:
    type: string
  id:
    $ref: ./UserID.yaml
  instance:
    type: ["null", string]
  instanceType:
    type: ["null", string]
    description: either an InstanceType or an empty string
  isRejoining:
    type: ["null", string]
  nameplateEffect:
    type: string
  platform:
    description: either a Platform or an empty string
    anyOf:
      - $ref: ./Platform.yaml
      - type: "null"
  profileEffect:
    type: string
  profilePicOverride:
    type: ["null", string]
  status:
    type: ["null", string]
    description: either a UserStatus or empty string
  travelingToInstance:
    type: ["null", string]
  travelingToWorld:
    anyOf:
      - $ref: ./LocationID.yaml
      - type: "null"
  userIcon:
    type: ["null", string]
  world:
    anyOf:
      - $ref: ./WorldID.yaml
      - type: "null"
