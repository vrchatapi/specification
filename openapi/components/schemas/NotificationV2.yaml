title: NotificationV2
type: object
properties:
  canDelete:
    type: boolean
  category:
    $ref: ./NotificationV2Category.yaml
  createdAt:
    type: string
    format: date-time
  data:
    oneOf:
      - $ref: ./NotificationEmpty.yaml
      - $ref: ./NotificationV2DataBadgeEarned.yaml
      - $ref: ./NotificationV2DataBoop.yaml
      - $ref: ./NotificationV2DataEventAnnouncement.yaml
      - $ref: ./NotificationV2DataGroupAnnouncement.yaml
      - $ref: ./NotificationV2DataGroupInformative.yaml
      - $ref: ./NotificationV2DataGroupTransfer.yaml
  details:
    $ref: ./NotificationV2DetailsBoop.yaml
  displayData:
    $ref: ./Unknown.yaml
  expiresAt:
    type: string
    format: date-time
  expiryAfterSeen:
    type:
      - integer
      - "null"
  id:
    type: string
  ignoreDND:
    type: boolean
  imageUrl:
    type:
      - string
      - "null"
  isSystem:
    type: boolean
  link:
    type:
      - string
      - "null"
    examples:
      - "event:grp_00000000-0000-0000-0000-000000000000,cal_00000000-0000-0000\
        -0000-000000000000"
  linkText:
    type:
      - string
      - "null"
  linkTextKey:
    type:
      - string
      - "null"
  message:
    type: string
  messageKey:
    type:
      - string
      - "null"
  receiverUserId:
    $ref: ./UserID.yaml
  relatedNotificationsId:
    type:
      - string
      - "null"
    examples:
      - cal_00000000-0000-0000-0000-000000000000
  requireSeen:
    type: boolean
  responses:
    type: array
    items:
      $ref: ./NotificationV2Response.yaml
  seen:
    type: boolean
  senderUserId:
    anyOf:
      - $ref: ./UserID.yaml
      - type: "null"
  senderUsername:
    type:
      - string
      - "null"
  title:
    type: string
  titleKey:
    type:
      - string
      - "null"
  type:
    $ref: ./NotificationV2Type.yaml
  updatedAt:
    type: string
    format: date-time
  version:
    type: integer
    default: 2
required:
  - canDelete
  - category
  - createdAt
  - data
  - expiresAt
  - expiryAfterSeen
  - id
  - ignoreDND
  - imageUrl
  - isSystem
  - link
  - linkText
  - linkTextKey
  - message
  - receiverUserId
  - relatedNotificationsId
  - requireSeen
  - responses
  - seen
  - senderUserId
  - senderUsername
  - title
  - titleKey
  - type
  - updatedAt
  - version
