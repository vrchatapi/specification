title: GroupAuditLogEntryDataGroupPostDelete
type: object
description: Data for group.post.delete events.
properties:
  authorId:
    $ref: ./UserID.yaml
    description: The ID of the post author.
  createdAt:
    type: string
    description: The creation timestamp of the post.
    format: date-time
  editorId:
    description: The ID of the user who last edited the post.
    anyOf:
      - $ref: ./UserID.yaml
      - type: "null"
  imageId:
    description: The image file ID attached to the post.
    anyOf:
      - $ref: ./GroupRoleID.yaml
      - type: "null"
  imageUrl:
    type:
      - string
      - "null"
    description: The URL of the post image.
    format: uri
  roleIds:
    type: array
    description: The role IDs that could see this post.
    items:
      $ref: ./GroupRoleID.yaml
  text:
    type: string
    description: The text content of the post.
  title:
    type: string
    description: The title of the post.
  updatedAt:
    type: string
    description: The last update timestamp of the post.
    format: date-time
  visibility:
    type: string
    description: The visibility of the post.
    enum:
      - group
      - public
required:
  - authorId
  - createdAt
  - editorId
  - imageId
  - imageUrl
  - roleIds
  - text
  - title
  - updatedAt
  - visibility
