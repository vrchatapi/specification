title: GroupAuditLogEntryDataGroupInstanceClose
type: object
description: Data for group.instance.close events.
properties:
  groupAccessType:
    type: string
    description: The access type of the instance.
    enum:
      - friends
      - invite
      - members
      - private
      - public
  roleIds:
    description: The role IDs that have access to the instance.
    anyOf:
      - type: array
        description: The role IDs that have access to the instance.
        items:
          $ref: ./GroupRoleID.yaml
      - type: "null"
required:
  - groupAccessType
  - roleIds
