title: Feedback
type: object
properties:
  commenterId:
    $ref: ./UserID.yaml
  commenterName:
    type: string
  contentAuthorId:
    anyOf:
      - $ref: ./UserID.yaml
      - type: "null"
  contentAuthorName:
    type:
      - string
      - "null"
  contentId:
    type: string
  contentName:
    type: string
  contentType:
    type: string
  contentVersion:
    type:
      - integer
      - "null"
  description:
    type:
      - string
      - "null"
  id:
    $ref: ./FeedbackID.yaml
  reason:
    type: string
  tags:
    type: array
    items:
      $ref: ./Tag.yaml
  type:
    type: string
required:
  - commenterId
  - commenterName
  - contentAuthorId
  - contentAuthorName
  - contentId
  - contentType
  - contentVersion
  - id
  - reason
  - tags
  - type
