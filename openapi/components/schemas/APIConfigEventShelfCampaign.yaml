title: APIConfigEventShelfCampaign
type: object
description: A seasonal campaign a group event can be listed under.
properties:
  description:
    type: string
    examples:
      - Include this event in the VRChat Tanabata event shelf.
  key:
    type: string
    examples:
      - tanabata
  name:
    type: string
    examples:
      - Tanabata Homeworld Moderation
required:
  - key
  - name
