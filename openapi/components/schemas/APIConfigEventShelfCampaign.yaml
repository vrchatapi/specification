title: APIConfigEventShelfCampaign
type: object
description: A seasonal campaign a group event can be listed under.
properties:
  description:
    type: string
    example: Include this event in the VRChat Tanabata event shelf.
  key:
    type: string
    example: tanabata
  name:
    type: string
    example: Tanabata Homeworld Moderation
required:
  - key
  - name
