title: GroupAuditLogEntryDataGroupPostCreate
type: object
description: Data for group.post.create events.
properties:
  authorId:
    $ref: ./UserID.yaml
    description: The ID of the post author.
  imageId:
    $ref: ./FileID.yaml
    description: The image file ID attached to the post.
    nullable: true
  roleIds:
    type: array
    description: The role IDs that can see this post.
    items:
      $ref: ./GroupRoleID.yaml
  sendNotification:
    type: boolean
    description: Whether a notification was sent for this post.
  text:
    type: string
    description: The text content of the post.
  title:
    type: string
    description: The title of the post.
  visibility:
    type: string
    description: The visibility of the post.
    enum: [group, public]
required:
  - authorId
  - imageId
  - roleIds
  - sendNotification
  - text
  - title
  - visibility
