title: CurrentUser
type: object
properties:
  acceptedPrivacyVersion:
    type: integer
    example: 0
    minimum: 0
  acceptedTOSVersion:
    type: integer
    example: 7
    minimum: 0
  accountDeletionDate:
    type: ["null", string]
    format: date
  accountDeletionLog:
    type: [array, "null"]
    items:
      $ref: ./AccountDeletionLog.yaml
  activeFriends:
    type: array
    items:
      $ref: ./UserID.yaml
  ageVerificationStatus:
    $ref: ./AgeVerificationStatus.yaml
  ageVerified:
    $ref: ./AgeVerified.yaml
  allowAvatarCopying:
    type: boolean
  appleDetails:
    $ref: ./ConnectedAccountDetails.yaml
  appleId:
    type: string
  authToken:
    type: string
    description: The auth token for NEWLY REGISTERED ACCOUNTS ONLY (/auth/register)
  bannerColor:
    $ref: ./Color.yaml
  bannerType:
    type: string
  bannerUrl:
    type: string
  completedTutorials:
    type: array
    items:
      type: string
  contentFilters:
    type: array
    description: These tags begin with `content_` and control content gating
    items:
      $ref: ./Tag.yaml
  currentAvatar:
    $ref: ./AvatarID.yaml
  currentAvatarImageUrl:
    $ref: ./CurrentAvatarImageUrl.yaml
  currentAvatarTags:
    type: array
    items:
      $ref: ./Tag.yaml
  currentAvatarThumbnailImageUrl:
    $ref: ./CurrentAvatarThumbnailImageUrl.yaml
  date_joined:
    type: string
    format: date
  developerType:
    $ref: ./DeveloperType.yaml
  discordDetails:
    $ref: ./DiscordDetails.yaml
  discordId:
    $ref: ./DiscordID.yaml
  displayName:
    type: string
  emailVerified:
    type: boolean
  fallbackAvatar:
    deprecated: true
    $ref: ./AvatarID.yaml
  friendGroupNames:
    deprecated: true
    type: array
    description: Always empty array.
    items:
      type: string
  friendKey:
    type: string
  friendRequestStatus:
    $ref: ./FriendRequestStatus.yaml
  friends:
    type: array
    items:
      $ref: ./UserID.yaml
  googleDetails:
    $ref: ./ConnectedAccountDetails.yaml
  googleId:
    type: string
  hasBirthday:
    type: boolean
  hasDiscordFriendsOptOut:
    type: boolean
  hasEmail:
    type: boolean
  hasLoggedInFromClient:
    type: boolean
  hasPendingEmail:
    type: boolean
  hasSharedConnectionsOptOut:
    type: boolean
  hideContentFilterSettings:
    type: boolean
  homeLocation:
    $ref: ./WorldID.yaml
  iconFrame:
    type: string
  iconUrl:
    type: string
  id:
    $ref: ./UserID.yaml
  instanceId:
    $ref: ./InstanceID.yaml
  isAdult:
    type: boolean
  isBoopingEnabled:
    type: boolean
    default: true
  isEconomyCreator:
    type: boolean
    default: false
  isFriend:
    type: boolean
    default: false
  isTemporary:
    type: boolean
    default: false
  last_activity:
    type: string
    format: date-time
  last_login:
    type: string
    format: date-time
  last_mobile:
    type: ["null", string]
    format: date-time
  last_platform:
    $ref: ./Platform.yaml
  location:
    $ref: ./LocationID.yaml
  nameplateEffect:
    type: string
  note:
    type: string
  obfuscatedEmail:
    type: string
  obfuscatedPendingEmail:
    type: string
  oculusId:
    type: string
  offlineFriends:
    type: array
    items:
      $ref: ./UserID.yaml
  onlineFriends:
    type: array
    items:
      $ref: ./UserID.yaml
  pastDisplayNames:
    type: array
    items:
      $ref: ./PastDisplayName.yaml
  personalizationOptOut:
    type: boolean
  picoId:
    type: string
  platform:
    type: string
  platform_history:
    type: array
    items:
      $ref: ./PlatformHistoryEntry.yaml
  presence:
    $ref: ./CurrentUserPresence.yaml
  profileEffect:
    type: string
  pronouns:
    type: string
  pronounsHistory:
    type: array
    items:
      type: string
  queuedInstance:
    type: ["null", string]
  receiveMobileInvitations:
    type: boolean
  state:
    $ref: ./UserState.yaml
  status:
    $ref: ./UserStatus.yaml
  statusDescription:
    type: string
  statusFirstTime:
    type: boolean
  statusHistory:
    type: array
    items:
      type: string
  steamDetails:
    $ref: ./ConnectedAccountDetails.yaml
  steamId:
    type: string
  tags:
    type: array
    items:
      $ref: ./Tag.yaml
  temporaryExpiryDate: {}
  travelingToInstance:
    type: string
  travelingToLocation:
    type: string
  travelingToWorld:
    type: string
  twitchDetails:
    $ref: ./ConnectedAccountDetails.yaml
  twitchId:
    type: string
  twoFactorAuthEnabled:
    type: boolean
  twoFactorAuthEnabledDate:
    type: ["null", string]
    format: date-time
  unsubscribe:
    type: boolean
  updated_at:
    type: string
    format: date-time
  userLanguage:
    type: ["null", string]
  userLanguageCode:
    type: ["null", string]
  username:
    type: string
    description: Your own unique name, used during login. Distinct from
      `displayName`, and never returned for another user.
  usesGeneratedPassword:
    type: boolean
  viveId:
    type: string
  worldId:
    $ref: ./WorldID.yaml
required:
  - acceptedTOSVersion
  - ageVerificationStatus
  - ageVerified
  - allowAvatarCopying
  - currentAvatar
  - currentAvatarImageUrl
  - currentAvatarTags
  - currentAvatarThumbnailImageUrl
  - date_joined
  - developerType
  - displayName
  - emailVerified
  - friendGroupNames
  - friendKey
  - friends
  - hasBirthday
  - hasEmail
  - hasLoggedInFromClient
  - hasPendingEmail
  - homeLocation
  - id
  - isAdult
  - isFriend
  - last_login
  - last_mobile
  - last_platform
  - obfuscatedEmail
  - obfuscatedPendingEmail
  - oculusId
  - pastDisplayNames
  - pronouns
  - pronounsHistory
  - state
  - status
  - statusDescription
  - statusFirstTime
  - statusHistory
  - steamDetails
  - steamId
  - tags
  - twoFactorAuthEnabled
  - unsubscribe
  - usesGeneratedPassword
