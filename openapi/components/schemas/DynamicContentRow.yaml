title: DynamicContentRow
type: object
properties:
  anyStyle:
    type: [array, "null"]
    items:
      type: string
  anyTag:
    type: [array, "null"]
    items:
      type: string
  avatarSpecific:
    type: boolean
  bannersTag:
    type: string
  categories:
    type: array
    items:
      type: string
  featuredResults:
    type: string
  groupPool:
    type: string
    examples:
      - mine
  index:
    type: integer
    minimum: 0
  marketplace:
    type: string
  maxPrice:
    type: integer
  minOccupants:
    type: integer
  minPrice:
    type: integer
  minimumInterestCount:
    type: integer
  minimumRemainingMinutes:
    type: integer
  mode:
    type: string
  n:
    type: integer
  name:
    oneOf:
      - type: string
        minLength: 1
      - $ref: ./LocalizedString.yaml
  nonFeaturedResults:
    type: string
  notag:
    type: [array, "null"]
    items:
      type: string
  params:
    type: object
    additionalProperties: true
  personalizedResults:
    type: string
    examples:
      - include
  platform:
    type: string
    description: 'Usually "ThisPlatformSupported", but can also be other values such as "all" or platform specific identifiers.'
    minLength: 1
  region:
    type: ["null", string]
  scope:
    type: string
    examples:
      - all
  shortName:
    oneOf:
      - type: string
      - type: "null"
      - $ref: ./LocalizedString.yaml
  sortHeading:
    type: string
    minLength: 1
  sortOrder:
    type: string
    minLength: 1
  sortOwnership:
    type: string
    minLength: 1
  style:
    type: ["null", string]
  tag:
    type: ["null", string]
    description: |-
      Tag to filter content for this row. Not a `Tag`: that type forbids the
      empty string, which this field uses for a row that is not tag-filtered.
    examples:
      - admin_spotlight_pc
  tags:
    type: [array, "null"]
    items:
      $ref: ./Tag.yaml
  type:
    type: string
    description: Type is not present if it is a world.
    examples:
      - avatar
  upcomingOffsetMinutes:
    type: integer
    examples:
      - 10080
  worldPool:
    type: string
    examples:
      - trending
required:
  - name
  - platform
