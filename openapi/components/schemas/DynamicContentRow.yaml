title: DynamicContentRow
type: object
properties:
  anyStyle:
    type:
      - array
      - "null"
    items:
      type: string
  anyTag:
    type:
      - array
      - "null"
    items:
      type: string
  avatarSpecific:
    type:
      - boolean
      - "null"
  bannersTag:
    type: string
  categories:
    type: array
    items:
      type: string
  featuredResults:
    $ref: ./DynamicContentRowResultsInclusion.yaml
  groupPool:
    type: string
    examples:
      - mine
  index:
    type: integer
    minimum: 0
  marketplace:
    type: string
  maxPrice:
    type: integer
  minOccupants:
    type: integer
  minPrice:
    type: integer
  minimumInterestCount:
    type: integer
  minimumRemainingMinutes:
    type: integer
  mode:
    $ref: ./DynamicContentRowMode.yaml
  n:
    type: integer
  name:
    $ref: ./LocalizableString.yaml
    minLength: 1
  nonFeaturedResults:
    type: string
  notag:
    type:
      - array
      - "null"
    items:
      type: string
  params:
    $ref: ./DynamicContentRowParams.yaml
  personalizedResults:
    $ref: ./DynamicContentRowResultsInclusion.yaml
  platform:
    type: string
    description: 'Usually "ThisPlatformSupported", but can also be other values such as "all" or platform specific identifiers.'
    minLength: 1
  region:
    anyOf:
      - $ref: ./InstanceRegion.yaml
      - type: "null"
  scope:
    $ref: ./DynamicContentRowScope.yaml
  shortName:
    anyOf:
      - $ref: ./LocalizableString.yaml
      - type: "null"
  sortHeading:
    $ref: ./DynamicContentRowSortHeading.yaml
  sortOrder:
    $ref: ./OrderOption.yaml
  sortOwnership:
    $ref: ./DynamicContentRowSortOwnership.yaml
  style:
    type:
      - string
      - "null"
  tag:
    type:
      - string
      - "null"
    description: |-
      Tag to filter content for this row. Not a `Tag`: that type forbids the
      empty string, which this field uses for a row that is not tag-filtered.
    examples:
      - admin_spotlight_pc
  tags:
    type:
      - array
      - "null"
    items:
      $ref: ./Tag.yaml
  type:
    type: string
    description: Type is not present if it is a world.
    examples:
      - avatar
  upcomingOffsetMinutes:
    type: integer
    examples:
      - 10080
  worldPool:
    type: string
    examples:
      - trending
required:
  - name
  - platform
