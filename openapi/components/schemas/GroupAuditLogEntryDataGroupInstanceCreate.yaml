title: GroupAuditLogEntryDataGroupInstanceCreate
type: object
description: Data for group.instance.create events.
properties:
  calendarEntryId:
    type: string
    description: The calendar entry ID if the instance was created from a calendar event.
    nullable: true
  groupAccessType:
    type: string
    description: The access type of the instance.
    enum: [friends, invite, members, private, public]
  roleIds:
    type: array
    description: The role IDs that have access to the instance.
    items:
      $ref: ./GroupRoleID.yaml
required:
  - calendarEntryId
  - groupAccessType
  - roleIds
