title: FileData
type: object
properties:
  category:
    $ref: ./FileDataCategory.yaml
  fileName:
    type: string
    minLength: 1
  md5:
    type: string
    minLength: 0
  sizeInBytes:
    type: integer
    minimum: 0
  status:
    $ref: ./FileStatus.yaml
  uploadId:
    type: string
    default: ""
    minLength: 0
  url:
    type: string
    minLength: 1
required:
  - category
  - fileName
  - sizeInBytes
  - status
  - uploadId
  - url
