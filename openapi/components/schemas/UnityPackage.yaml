title: UnityPackage
type: object
properties:
  assetUrl:
    type: ["null", string]
    examples:
      - https://api.vrchat.cloud/api/1/file/file_cd0caa7b-69ba-4715-8dfe-7d667a9d2537/65/file
  assetUrlObject:
    type: object
    examples:
      - {}
  assetVersion:
    type: integer
    examples:
      - 4
    minimum: 0
  created_at:
    type: ["null", string]
    examples:
      - "2020-09-10T06:13:27.777Z"
    format: date-time
  id:
    $ref: ./UnityPackageID.yaml
  impostorUrl:
    type: ["null", string]
  impostorizerVersion:
    type: string
    examples:
      - 0.17.0
  performanceRating:
    $ref: ./PerformanceRatings.yaml
  platform:
    $ref: ./Platform.yaml
  pluginUrl:
    type: string
    examples:
      - ""
  pluginUrlObject:
    type: object
    examples:
      - {}
  scanStatus:
    type: string
  unitySortNumber:
    type: integer
    examples:
      - 20180414000
    format: int64
    minimum: 0
  unityVersion:
    type: string
    default: 5.3.4p1
    examples:
      - 2022.3.6f1
    minLength: 1
  variant:
    type: string
  worldSignature:
    type: ["null", string]
    examples:
      - AHiPAWerwCpeYrxDthF5TU2SdUWEWnm43UAn8PKRXlS8k8tVRQ==
required:
  - assetVersion
  - id
  - platform
  - unityVersion
