title: FavoritedWorld
type: object
properties:
  authorId:
    $ref: ./UserID.yaml
  authorName:
    type: string
    minLength: 1
  capacity:
    type: integer
    examples:
      - 8
  created_at:
    type: string
    format: date-time
  defaultContentSettings:
    $ref: ./InstanceContentSettings.yaml
  description:
    type: string
    minLength: 0
  disabledPropAbilities:
    type: array
    items: {}
  favoriteGroup:
    type: string
    minLength: 1
  favoriteId:
    $ref: ./FavoriteID.yaml
  favorites:
    type: integer
    default: 0
    examples:
      - 12024
    minimum: 0
  featured:
    type: boolean
    default: false
  heat:
    type: integer
    default: 0
    examples:
      - 5
    minimum: 0
  id:
    $ref: ./WorldID.yaml
  imageUrl:
    type: string
    minLength: 1
  isHypeTrainEligible:
    type: boolean
  labsPublicationDate:
    type: string
    examples:
      - none
    minLength: 1
  name:
    type: string
    minLength: 0
  occupants:
    type: integer
    default: 0
    examples:
      - 47
    minimum: 0
  organization:
    type: string
    default: vrchat
    minLength: 1
  popularity:
    type: integer
    default: 0
    examples:
      - 8
    minimum: 0
  previewYoutubeId:
    type:
      - string
      - "null"
  publicationDate:
    type: string
    examples:
      - none
    minLength: 1
  recommendedCapacity:
    type: integer
    examples:
      - 16
  releaseStatus:
    $ref: ./ReleaseStatus.yaml
  storeId:
    $ref: ./StoreID.yaml
  tags:
    type: array
    items:
      $ref: ./Tag.yaml
  thumbnailImageUrl:
    type: string
    minLength: 1
  udonProducts:
    type: array
    items:
      $ref: ./UdonProductId.yaml
  unityPackages:
    type: array
    items:
      $ref: ./UnityPackage.yaml
    minItems: 1
  updated_at:
    type: string
    format: date-time
  urlList:
    type: array
    items:
      type: string
  version:
    type: integer
    minimum: 1
  visits:
    type: integer
    default: 0
    examples:
      - 9988675
    minimum: 0
required:
  - authorName
  - capacity
  - id
  - imageUrl
  - name
  - releaseStatus
  - thumbnailImageUrl
