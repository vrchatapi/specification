title: GroupMember
type: object
description: May be null when attempting to retrieve group membership for a user who is not part of the group
properties:
  acceptedByDisplayName:
    type:
      - string
      - "null"
    description: Only missing when explicitly fetching own user.
  acceptedById:
    type:
      - string
      - "null"
    description: Only missing when explicitly fetching own user.
  bannedAt:
    type:
      - string
      - "null"
    description: Only missing when explicitly fetching own user.
    format: date-time
  createdAt:
    type:
      - string
      - "null"
    description: Only missing when explicitly fetching own user.
    format: date-time
  groupId:
    $ref: ./GroupID.yaml
  hasJoinedFromPurchase:
    type: boolean
    description: Missing when explicitly fetching own user, or when group isn't linked to a purchase.
  id:
    $ref: ./GroupMemberID.yaml
  isRepresenting:
    type: boolean
    description: Whether the user is representing the group. This makes the group show up above the name tag in-game.
    default: false
    examples:
      - true
  isSubscribedToAnnouncements:
    type: boolean
    default: false
  isSubscribedToEventAnnouncements:
    type: boolean
    description: Only missing when explicitly fetching own user.
  joinedAt:
    type:
      - string
      - "null"
    format: date-time
  lastPostReadAt:
    type:
      - string
      - "null"
    format: date-time
  mRoleIds:
    type: array
    items:
      $ref: ./GroupRoleID.yaml
  managerNotes:
    type:
      - string
      - "null"
    description: Only missing when explicitly fetching own user.
  membershipStatus:
    $ref: ./GroupMemberStatus.yaml
  roleIds:
    type: array
    items:
      $ref: ./GroupRoleID.yaml
  user:
    anyOf:
      - $ref: ./GroupMemberLimitedUser.yaml
      - type: "null"
  userId:
    $ref: ./UserID.yaml
  visibility:
    type: string
    examples:
      - visible
required:
  - groupId
  - id
  - isRepresenting
  - mRoleIds
  - roleIds
  - userId
