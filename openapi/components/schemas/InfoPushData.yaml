title: InfoPushData
type: object
description: ""
properties:
  article:
    $ref: ./InfoPushDataArticle.yaml
  authorName:
    type: string
  avatarId:
    $ref: ./AvatarID.yaml
  bannerImageUrl:
    type: string
  categories:
    type: array
    items:
      $ref: ./InfoPushDataCategory.yaml
  category:
    type: string
  contentList:
    $ref: ./DynamicContentRow.yaml
  description:
    x-if:
      when: jsonschema
      then:
        oneOf:
          - type: string
          - $ref: ./LocalizedString.yaml
      else:
        type: string
  disclaimerText:
    type: string
  domainList:
    type: array
    items:
      type: object
      properties:
        domain:
          type: string
  featuredAvatarCategoryId:
    type: string
  finalName:
    type: string
  hoverToJoin:
    type: boolean
  iconImageUrl:
    type: string
  imageUrl:
    type: ["null", string]
  ipsQuery:
    $ref: ./InfoPushIpsQuery.yaml
  isNew:
    type: boolean
  listingIds:
    type: array
    items:
      type: string
  name:
    x-if:
      when: jsonschema
      then:
        oneOf:
          - type: string
          - $ref: ./LocalizedString.yaml
      else:
        type: string
  onPressed:
    $ref: ./InfoPushDataClickable.yaml
  overrideName: {}
  rows:
    type: [integer, "null"]
    description: Number of rows to render.
  search:
    $ref: ./InfoPushDataSearch.yaml
  shortName:
    x-if:
      when: jsonschema
      then:
        oneOf:
          - type: string
          - type: "null"
          - $ref: ./LocalizedString.yaml
      else:
        type: ["null", string]
  template:
    type: string
  thumbnailImageUrl:
    type: ["null", string]
  tooltipDescription:
    x-if:
      when: jsonschema
      then:
        oneOf:
          - type: string
          - $ref: ./LocalizedString.yaml
      else:
        type: string
  version:
    type: string
    example: 2021.3.4
    minLength: 1

  weight:
    type: integer

  worldTag:
    type: string
