title: InfoPushData
type: object
description: ""
properties:
  article:
    $ref: ./InfoPushDataArticle.yaml
  authorName:
    type: string
  avatarId:
    $ref: ./AvatarID.yaml
  bannerImageUrl:
    type: string
  body:
    type: string
  categories:
    type: array
    items:
      $ref: ./InfoPushDataCategory.yaml
  category:
    type: string
  contentList:
    $ref: ./DynamicContentRow.yaml
  cta:
    $ref: ./InfoPushDataCallToAction.yaml
  deliveryBehavior:
    $ref: ./InfoPushDataDeliveryBehavior.yaml
  description:
    x-if:
      when: jsonschema
      then:
        oneOf:
          - type: string
          - $ref: ./LocalizedString.yaml
      else:
        type: string
  disclaimerText:
    type: string
  domainList:
    type: array
    items:
      type: object
      properties:
        domain:
          type: string
  featuredAvatarCategoryId:
    type: string
  finalName:
    type: string
  hoverToJoin:
    type: boolean
  iconImageUrl:
    type: string
  imageFileId:
    $ref: ./FileID.yaml
  imageUrl:
    type: string
    nullable: true
  ipsQuery:
    $ref: ./InfoPushIpsQuery.yaml
  isNew:
    type: boolean
  listingIds:
    type: array
    items:
      type: string
  mediaType:
    type: string
    example: video
  name:
    x-if:
      when: jsonschema
      then:
        oneOf:
          - type: string
          - $ref: ./LocalizedString.yaml
      else:
        type: string
  onPressed:
    $ref: ./InfoPushDataClickable.yaml
  overrideName: {}
  rows:
    type: integer
    description: Number of rows to render.
    nullable: true
  search:
    $ref: ./InfoPushDataSearch.yaml
  shortName:
    x-if:
      when: jsonschema
      then:
        oneOf:
          - type: string
          - type: "null"
          - $ref: ./LocalizedString.yaml
      else:
        type: string
        nullable: true
  showInWorldIds: {}
  template:
    type: string
  thumbnailImageUrl:
    type: string
    nullable: true
  title:
    type: string
  tooltipDescription:
    x-if:
      when: jsonschema
      then:
        oneOf:
          - type: string
          - $ref: ./LocalizedString.yaml
      else:
        type: string
  version:
    type: string
    example: 2021.3.4
    minLength: 1
  videoFileId:
    $ref: ./FileID.yaml
  videoUrl:
    type: string
  weight:
    type: integer
  worldTag:
    type: string
