on:
  push:
    branches:
      - main
      - stable
  pull_request:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name == 'push' && format('{0}-{1}', github.workflow, github.ref) || github.run_id }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: pnpm/setup@v2
        with:
          runtime: bun@latest
          cache: true

      - if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: |
          changes=$(git diff --name-only --diff-filter=d "${{ github.event.before }}" "${{ github.sha }}")
          {
            echo 'changes<<eof_${{ github.run_id }}'
            echo "$changes"
            echo 'eof_${{ github.run_id }}'
          } >> $GITHUB_ENV

      - if: github.event_name == 'pull_request'
        run: |
          changes=$(git diff --name-only --diff-filter=d "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")
          {
            echo 'changes<<eof_${{ github.run_id }}'
            echo "$changes"
            echo 'eof_${{ github.run_id }}'
          } >> $GITHUB_ENV

      - name: lint changed files
        if: env.changes != ''
        run: |
          pattern=$(echo "${{ env.changes }}" | tr '\n' '|' | sed 's/|$//')
          pnpm run lint-ci 2>&1 | grep -E "$pattern" || true
          exit ${PIPESTATUS[0]:-1}

      - name: lint files
        if: env.changes == ''
        continue-on-error: true
        run: pnpm run lint-ci

      - name: test the redocly plugin
        run: bun test ./redocly

      - name: test and build redocly-plugin-downlevel
        run: pnpm run test:downlevel

      - name: assert no unused paths
        if: env.changes != ''
        shell: bash
        run: |
          status=0
          defined=$(yq -re '.paths | keys' openapi/components/paths/*.yaml | yq -r 'sort_by(.) | .[]')
          referenced=$(yq -re 'sort_by(keys) | keys[]' openapi/components/paths.yaml)
          mapfile -t expected <<< "$defined"
          mapfile -t actual <<< "$referenced"

          for ((i = 0, j = 0; i < "${#expected[@]}"; i++)); do
              if [[ "${expected[$i]}" == "${actual[$j]}" ]]; then
                  j=$((j + 1))
              else
                  status=2
                  echo "Missing path: ${expected[$i]}" >&2;
              fi
          done;

          if [[ "$status" -ne 0 ]]; then
              exit "$status"
          fi

  bundle:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: pnpm/setup@v2
        with:
          runtime: bun@latest
          cache: true

      - name: version the build for the branch it releases from
        id: version
        run: |
          declared=$(yq -r '.info.version' openapi/openapi.yaml)
          latest=$(git tag --list 'v*' | sed 's/^v//' | xargs -r pnpm -s semver --range '*' | tail -n 1 || true)

          release=true

          if [ "$GITHUB_REF_NAME" = stable ]; then
            version=$declared

            if ! pnpm -s semver "$declared" > /dev/null; then
              echo "::error::$declared is not a version"
              exit 1
            elif git rev-parse --quiet --verify "refs/tags/v$declared" > /dev/null; then
              release=false
            elif [ -n "$latest" ] && pnpm -s semver --range "<$latest" "$declared" > /dev/null; then
              echo "::error::$declared is below the latest release, $latest"
              exit 1
            fi
          else
            base=$(pnpm -s semver --increment patch "${latest:-$declared}")
            highest=$(git tag --list "v$base-nightly.*" | sed "s/^v$base-nightly\.//" | grep -xE '[0-9]+' | sort -n | tail -n 1 || true)
            version="$base-nightly.$(( ${highest:-0} + 1 ))"
          fi

          echo "version=$version" >> "$GITHUB_ENV"
          echo "release=$release" >> "$GITHUB_OUTPUT"

      - run: bun --bun run bundle

      - name: lint the downleveled bundles as the version they declare
        run: bun --bun run test:versions

      - uses: actions/github-script@v9
        with:
          script: |
            const { readdir } = require("node:fs/promises");
            const { resolve, dirname } = require("node:path");

            const { DefaultArtifactClient } = require("@actions/artifact");

            const artifact = new DefaultArtifactClient();
            const files = await readdir("./dist");

            const artifacts = await Promise.all(files.map(async (file) => {
              const pathname = resolve(`./dist/${file}`);
              return artifact.uploadArtifact(file, [pathname], dirname(pathname));
            }));

  build_javascript:
    needs: bundle
    permissions:
      contents: read
      id-token: write
    uses: vrchatapi/vrchatapi-javascript/.github/workflows/ci.yaml@main

  build_rust:
    needs: bundle
    uses: vrchatapi/vrchatapi-rust/.github/workflows/ci.yaml@main

  build_java:
    needs: bundle
    uses: vrchatapi/vrchatapi-java/.github/workflows/ci.yaml@main

  build_python:
    needs: bundle
    uses: vrchatapi/vrchatapi-python/.github/workflows/ci.yaml@main

  build_csharp:
    needs: bundle
    uses: vrchatapi/vrchatapi-csharp/.github/workflows/ci.yaml@main

  build_dart:
    needs: bundle
    uses: vrchatapi/vrchatapi-dart/.github/workflows/ci.yaml@main

  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - lint
      - bundle
    if: ${{ !failure() && !cancelled() && github.event_name != 'schedule' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stable') && needs.bundle.outputs.release == 'true' && !contains(github.event.head_commit.message, '[no release]') }}
    concurrency:
      group: release
    permissions:
      contents: write
    outputs:
      version: ${{ steps.metadata.outputs.version }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: openapi*
          merge-multiple: true

      - id: metadata
        run: |
          version=$(jq -r '.info.version' dist/openapi.json)

          if [[ "$version" == *-nightly.* ]]; then
            echo "prerelease=true" >> $GITHUB_ENV
          else
            echo "prerelease=false" >> $GITHUB_ENV
          fi

          echo "version=$version" >> $GITHUB_ENV
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: create release
        if: env.prerelease == 'false'
        run: gh release create v${{ env.version }} dist/* --target "$GITHUB_SHA" --generate-notes

      - name: create release (nightly)
        if: env.prerelease == 'true'
        run: |
          gh release create v${{ env.version }} dist/* \
            --target "$GITHUB_SHA" \
            --generate-notes \
            --prerelease

      - name: refresh the nightly release
        if: github.ref == 'refs/heads/main'
        run: |
          gh release upload nightly dist/* --clobber
          gh release edit nightly --notes "The latest build from main, currently v${{ env.version }}. Its files are replaced whenever a new build is published."

  release_dispatch:
    uses: ./.github/workflows/release_dispatch.yaml
    needs: release
    permissions: {}
    secrets:
      RELEASE_DISPATCH_TOKEN: ${{ secrets.RELEASE_DISPATCH_TOKEN }}
    with:
      version: ${{ needs.release.outputs.version }}

  test:
    if: github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[no test]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: test
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/setup@v2
        with:
          runtime: bun@latest
          cache: true

      - run: bun --bun run bundle

      - run: pnpm test
        env:
          VRCHAT_EMAIL: ${{ secrets.VRCHAT_EMAIL }}
          VRCHAT_PASSWORD: ${{ secrets.VRCHAT_PASSWORD }}
          VRCHAT_TOTP_SECRET: ${{ secrets.VRCHAT_TOTP_SECRET }}
          VRCHAT_FRIEND_ID: ${{ secrets.VRCHAT_FRIEND_ID }}
          VRCHAT_GROUP_ID: ${{ secrets.VRCHAT_GROUP_ID }}

      - if: "!cancelled()"
        timeout-minutes: 2
        run: sh test/report.sh --format github

      - if: "!cancelled()"
        timeout-minutes: 2
        run: sh test/report.sh >> "$GITHUB_STEP_SUMMARY"

      - if: "!cancelled()"
        timeout-minutes: 5
        run: |
          status=0
          pnpm -s test:drift --max-findings 1000 --output test/.out/drift.txt || status=$?
          pnpm -s test:drift --format json --output test/.out/redocly-test-drift.json || true
          cat test/.out/drift.txt
          {
            printf '### Drift\n\n```\n'
            cat test/.out/drift.txt
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - if: "!cancelled()"
        run: |
          cp test/.out/har/arazzo.har test/.out/redocly-test.har
          cp test/.out/respect.json test/.out/redocly-test.json

      - if: "!cancelled()"
        uses: actions/upload-artifact@v7
        with:
          name: redocly-test.har
          path: test/.out/redocly-test.har

      - if: "!cancelled()"
        uses: actions/upload-artifact@v7
        with:
          name: redocly-test.json
          path: test/.out/redocly-test.json

      - if: "!cancelled()"
        uses: actions/upload-artifact@v7
        with:
          name: redocly-test-drift.json
          path: test/.out/redocly-test-drift.json
