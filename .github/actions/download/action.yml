name: Fetch a specification bundle
description: >-
  Leaves the requested bundle in the working directory: this run's artifact
  inside the specification repository, and a release's asset anywhere else.

inputs:
  tag:
    description: >-
      Release to fetch the bundle from, such as `nightly` or `v1.22.1`. Without
      one, a release dispatch fetches the release it announces, pushes and pull
      requests fetch `nightly`, and anything else fetches `latest`.
    required: false
    default: ""
  bundle:
    description: >-
      Bundle to fetch.
    required: false
    default: openapi.json

runs:
  using: composite
  steps:
    - if: github.repository == 'vrchatapi/specification'
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.bundle }}
        path: .

    - if: github.repository != 'vrchatapi/specification'
      env:
        BUNDLE: ${{ inputs.bundle }}
        EVENT: ${{ github.event_name }}
        RELEASE: ${{ github.event.client_payload.version }}
        TAG: ${{ inputs.tag }}
      run: |
        tag=$TAG
        if [ -z "$tag" ]; then
          case "$EVENT" in
            repository_dispatch) tag="v$RELEASE" ;;
            push | pull_request) tag=nightly ;;
            *) tag=latest ;;
          esac
        fi

        if [ "$tag" = latest ]; then
          url="https://github.com/vrchatapi/specification/releases/latest/download/$BUNDLE"
        else
          url="https://github.com/vrchatapi/specification/releases/download/$tag/$BUNDLE"
        fi

        curl -Lfo "$BUNDLE" "$url"
      shell: bash
