name: Report the SDKs a run builds
description: >-
  Keeps one pull request comment up to date with what each SDK job is doing.
  Without `installs` it polls the run and reports progress; with `installs` it
  writes the commands the SDKs reported for themselves and returns.

inputs:
  token:
    description: >-
      Token used to read the run's jobs and write the comment.
    required: false
    default: ${{ github.token }}
  installs:
    description: >-
      JSON object mapping an SDK to how it says to install what it built.
    required: false
    default: ""
  interval:
    description: >-
      Seconds between refreshes.
    required: false
    default: "15"
  timeout:
    description: >-
      Seconds to keep refreshing before giving up.
    required: false
    default: "2700"

runs:
  using: composite
  steps:
    - uses: actions/github-script@v9
      env:
        INSTALLS: ${{ inputs.installs }}
        INTERVAL: ${{ inputs.interval }}
        TIMEOUT: ${{ inputs.timeout }}
      with:
        github-token: ${{ inputs.token }}
        script: |
          const marker = '<!-- sdk-preview -->';
          const installs = process.env.INSTALLS ? JSON.parse(process.env.INSTALLS) : null;
          const interval = Number(process.env.INTERVAL) * 1000;
          const deadline = Date.now() + Number(process.env.TIMEOUT) * 1000;

          const pull = context.payload.pull_request?.number;
          if (!pull) return;

          async function jobsBySdk() {
            const jobs = await github.paginate(
              github.rest.actions.listJobsForWorkflowRun,
              { ...context.repo, run_id: context.runId, per_page: 100 },
            );

            const bySdk = {};

            for (const job of jobs) {
              const match = /^build_(\w+) \/ (.+)$/.exec(job.name);
              if (!match) continue;

              const [, sdk, step] = match;
              (bySdk[sdk] ??= []).push({ ...job, step: step.split(' (')[0] });
            }

            return bySdk;
          }

          function state(jobs) {
            if (!jobs?.length) return { status: 'queued', done: false };

            const failed = jobs.find(({ conclusion }) =>
              conclusion === 'failure' || conclusion === 'cancelled');
            if (failed) return { status: `failed to ${failed.step}`, done: true };

            const running = jobs.find(({ status }) => status !== 'completed');
            if (running) return { status: running.step, done: false };

            return { status: 'built', done: true };
          }

          async function upsert(body) {
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: pull,
              per_page: 100,
            });

            const existing = comments.find((comment) => comment.body.includes(marker));

            if (!existing) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: pull,
                body,
              });
              return;
            }

            if (existing.body !== body) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body,
              });
            }
          }

          function render(bySdk) {
            const rows = Object.keys(bySdk).sort().map((sdk) => {
              const { status } = state(bySdk[sdk]);
              const how = status === 'built' ? (installs?.[sdk] ?? '') : '';

              return `| ${sdk} | ${status} | ${how} |`;
            });

            return [
              marker,
              '### SDKs built from this specification',
              '',
              '| SDK | Status | Install |',
              '| --- | ------ | ------- |',
              ...rows,
            ].join('\n');
          }

          if (installs) {
            await upsert(render(await jobsBySdk()));
            return;
          }

          while (Date.now() < deadline) {
            const bySdk = await jobsBySdk();
            await upsert(render(bySdk));

            const sdks = Object.values(bySdk).map(state);
            if (sdks.length > 0 && sdks.every(({ done }) => done)) return;

            await new Promise((resolve) => setTimeout(resolve, interval));
          }
