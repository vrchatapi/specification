name: Report the SDKs a run builds
description: >-
  Keeps one pull request comment up to date with the bundles a run produced and
  what each SDK job is doing. Without `installs` it polls the run and reports
  progress; with `installs` it records how to install what an SDK built and
  returns. Commands already in the comment are kept, so each SDK can report as
  soon as it finishes.

inputs:
  token:
    description: >-
      Token used to read the run's jobs and write the comment.
    required: false
    default: ${{ github.token }}
  sdks:
    description: >-
      JSON object naming each SDK a `build_<key>` job builds, and the repository
      it comes from.
    required: true
  bundles:
    description: >-
      JSON array of the bundles this run produced, as `name` and `url`.
    required: false
    default: "[]"
  installs:
    description: >-
      JSON object mapping an SDK to how it says to install what it built.
    required: false
    default: ""
  interval:
    description: >-
      Seconds between refreshes.
    required: false
    default: "5"
  timeout:
    description: >-
      Seconds to keep refreshing before giving up.
    required: false
    default: "2700"

runs:
  using: composite
  steps:
    - uses: actions/github-script@v9
      env:
        SDKS: ${{ inputs.sdks }}
        BUNDLES: ${{ inputs.bundles }}
        INSTALLS: ${{ inputs.installs }}
        INTERVAL: ${{ inputs.interval }}
        TIMEOUT: ${{ inputs.timeout }}
      with:
        github-token: ${{ inputs.token }}
        script: |
          const marker = '<!-- sdk-preview -->';
          const opening = '<!-- installs ';
          const closing = ' -->';

          const sdks = JSON.parse(process.env.SDKS);
          const bundles = JSON.parse(process.env.BUNDLES);
          const reported = process.env.INSTALLS ? JSON.parse(process.env.INSTALLS) : null;

          const interval = Number(process.env.INTERVAL) * 1000;
          const deadline = Date.now() + Number(process.env.TIMEOUT) * 1000;

          const pull = context.payload.pull_request?.number;
          if (!pull) return;

          const stages = {
            queued: 'queued',
            generate: 'generating',
            build: 'building',
            test: 'testing',
            install: 'installing',
            analyze: 'analysing',
            pana: 'analysing',
            format: 'checking formatting',
            built: 'built',
            failed: 'failed',
          };

          async function jobsBySdk() {
            const jobs = await github.paginate(
              github.rest.actions.listJobsForWorkflowRun,
              { ...context.repo, run_id: context.runId, per_page: 100 },
            );

            const bySdk = {};

            for (const job of jobs) {
              const match = /^build_(\w+) \/ (.+)$/.exec(job.name);
              if (!match) continue;

              const [, sdk, step] = match;
              (bySdk[sdk] ??= []).push({ ...job, step: step.split(' (')[0] });
            }

            return bySdk;
          }

          function state(jobs) {
            if (!jobs?.length) return { stage: 'queued', done: false };

            const failed = jobs.some(({ conclusion }) =>
              conclusion === 'failure' || conclusion === 'cancelled');
            if (failed) return { stage: 'failed', done: true };

            const running = jobs.find(({ status }) => status !== 'completed');
            if (running) return { stage: running.step, done: false };

            return { stage: 'built', done: true };
          }

          function recall(body) {
            const start = body?.indexOf(opening) ?? -1;
            if (start === -1) return {};

            const end = body.indexOf(closing, start);
            if (end === -1) return {};

            try {
              return JSON.parse(body.slice(start + opening.length, end));
            } catch {
              return {};
            }
          }

          function render(bySdk, installs) {
            const lines = [marker, `${opening}${JSON.stringify(installs)}${closing}`];

            if (bundles.length > 0) {
              const byStem = {};

              for (const { name, url } of bundles) {
                const cut = name.lastIndexOf('.');
                const stem = cut === -1 ? name : name.slice(0, cut);
                const format = cut === -1 ? name : name.slice(cut + 1);

                (byStem[stem] ??= []).push({ format, url });
              }

              lines.push('### Bundles', '');

              for (const stem of Object.keys(byStem).sort((a, b) => b.localeCompare(a))) {
                const formats = byStem[stem]
                  .sort((a, b) => a.format.localeCompare(b.format))
                  .map(({ format, url }) => `[${format}](${url})`);

                lines.push(`* ${stem} (${formats.join(', ')})`);
              }

              lines.push('');
            }

            lines.push('### SDKs', '');

            for (const [key, { name, repository }] of Object.entries(sdks)) {
              const { stage } = state(bySdk[key]);
              const how = installs[key];
              const suffix = how ? `  ${how.startsWith('[') ? how : `\`${how}\``}` : '';

              lines.push(`* [**${name}**](https://github.com/${repository}) → ${stages[stage] ?? stage}${suffix}`);
            }

            const sha = context.payload.pull_request.head.sha;
            const commit = `https://github.com/${context.repo.owner}/${context.repo.repo}/commit/${sha}`;

            lines.push('', `<sub>built from [\`${sha.slice(0, 7)}\`](${commit})</sub>`);

            return lines.join('\n');
          }

          async function upsert(bySdk) {
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: pull,
              per_page: 100,
            });

            const existing = comments.find((comment) => comment.body.includes(marker));
            const installs = { ...recall(existing?.body), ...reported };
            const body = render(bySdk, installs);

            if (!existing) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: pull,
                body,
              });
              return;
            }

            if (existing.body !== body) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body,
              });
            }
          }

          if (reported) {
            await upsert(await jobsBySdk());
            return;
          }

          while (Date.now() < deadline) {
            const bySdk = await jobsBySdk();
            const states = Object.keys(sdks).map((key) => state(bySdk[key]));

            await upsert(bySdk);
            if (states.every(({ done }) => done)) return;

            await new Promise((resolve) => setTimeout(resolve, interval));
          }
