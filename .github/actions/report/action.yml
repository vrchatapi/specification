name: Report the SDKs a run builds
description: >-
  Keeps one pull request comment up to date with the bundles a run produced and
  the SDKs it builds. Called without `install` it follows the run and reports
  which SDKs are still building; called with `install` an SDK records how to
  install what it just built. Anything already recorded is kept, so an SDK can
  report as soon as it is ready.

inputs:
  token:
    description: >-
      Token used to read the run's jobs and write the comment.
    required: false
    default: ${{ github.token }}
  sdk:
    description: >-
      Key of the SDK reporting itself, matching its `build_<key>` job.
    required: false
    default: ""
  install:
    description: >-
      How to install what the reporting SDK built.
    required: false
    default: ""
  bundles:
    description: >-
      JSON array of the bundles this run produced, as `name` and `url`.
    required: false
    default: "[]"
  interval:
    description: >-
      Seconds between refreshes.
    required: false
    default: "5"
  timeout:
    description: >-
      Seconds to keep refreshing before giving up.
    required: false
    default: "2700"

runs:
  using: composite
  steps:
    - uses: actions/github-script@v9
      env:
        SDK: ${{ inputs.sdk }}
        INSTALL: ${{ inputs.install }}
        BUNDLES: ${{ inputs.bundles }}
        INTERVAL: ${{ inputs.interval }}
        TIMEOUT: ${{ inputs.timeout }}
      with:
        github-token: ${{ inputs.token }}
        script: |
          const marker = '<!-- sdk-preview -->';
          const opening = '<!-- installs ';
          const closing = ' -->';

          const sdks = {
            javascript: { name: 'JavaScript', repository: 'vrchatapi/vrchatapi-javascript' },
            rust: { name: 'Rust', repository: 'vrchatapi/vrchatapi-rust' },
            java: { name: 'Java', repository: 'vrchatapi/vrchatapi-java' },
            python: { name: 'Python', repository: 'vrchatapi/vrchatapi-python' },
            csharp: { name: 'C#', repository: 'vrchatapi/vrchatapi-csharp' },
            dart: { name: 'Dart', repository: 'vrchatapi/vrchatapi-dart' },
          };

          const bundles = JSON.parse(process.env.BUNDLES);
          const reported = process.env.SDK && process.env.INSTALL
            ? { [process.env.SDK]: process.env.INSTALL }
            : null;

          const interval = Number(process.env.INTERVAL) * 1000;
          const deadline = Date.now() + Number(process.env.TIMEOUT) * 1000;

          const pull = context.payload.pull_request?.number;
          if (!pull) return;

          async function building() {
            const jobs = await github.paginate(
              github.rest.actions.listJobsForWorkflowRun,
              { ...context.repo, run_id: context.runId, per_page: 100 },
            );

            const running = new Set();
            const seen = new Set();

            for (const job of jobs) {
              const match = /^build_(\w+) \//.exec(job.name);
              if (!match) continue;

              const [, sdk] = match;
              seen.add(sdk);
              if (job.status !== 'completed') running.add(sdk);
            }

            return { running, done: seen.size > 0 && running.size === 0 };
          }

          const sha = context.payload.pull_request.head.sha;

          function recall(body) {
            const start = body?.indexOf(opening) ?? -1;
            if (start === -1) return {};

            const end = body.indexOf(closing, start);
            if (end === -1) return {};

            try {
              const recorded = JSON.parse(body.slice(start + opening.length, end));
              return recorded.sha === sha ? recorded.installs ?? {} : {};
            } catch {
              return {};
            }
          }

          function render(running, installs) {
            const lines = [marker, `${opening}${JSON.stringify({ sha, installs })}${closing}`];

            if (bundles.length > 0) {
              const byStem = {};

              for (const { name, url } of bundles) {
                const cut = name.lastIndexOf('.');
                const stem = cut === -1 ? name : name.slice(0, cut);
                const format = cut === -1 ? name : name.slice(cut + 1);

                (byStem[stem] ??= []).push({ format, url });
              }

              lines.push('### Bundles', '');

              for (const stem of Object.keys(byStem).sort((a, b) => b.localeCompare(a))) {
                const formats = byStem[stem]
                  .sort((a, b) => a.format.localeCompare(b.format))
                  .map(({ format, url }) => `[${format}](${url})`);

                lines.push(`* ${stem} (${formats.join(', ')})`);
              }

              lines.push('');
            }

            lines.push('### SDKs', '');

            for (const [key, { name, repository }] of Object.entries(sdks)) {
              const how = installs[key];
              const suffix = running.has(key) ? ' → building' : how ? `  \`${how}\`` : '';

              lines.push(`* [**${name}**](https://github.com/${repository})${suffix}`);
            }

            const commit = `https://github.com/${context.repo.owner}/${context.repo.repo}/commit/${sha}`;

            lines.push('', `<sub>built from [\`${sha.slice(0, 7)}\`](${commit})</sub>`);

            return lines.join('\n');
          }

          async function current() {
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: pull,
              per_page: 100,
            });

            return comments.find((comment) => comment.body.includes(marker));
          }

          async function upsert(running) {
            const existing = await current();
            const installs = { ...recall(existing?.body), ...reported };
            const body = render(running, installs);

            if (!existing) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: pull,
                body,
              });
              return;
            }

            if (existing.body !== body) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body,
              });
            }
          }

          if (reported) {
            for (let attempt = 0; attempt < 5; attempt += 1) {
              const { running } = await building();
              await upsert(running);

              const installs = recall((await current())?.body);
              if (installs[process.env.SDK] === process.env.INSTALL) return;

              await new Promise((resolve) => setTimeout(resolve, 2000));
            }

            return;
          }

          while (Date.now() < deadline) {
            const { running, done } = await building();
            await upsert(running);

            if (done) return;

            await new Promise((resolve) => setTimeout(resolve, interval));
          }
