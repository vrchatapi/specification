# See https://redoc.ly/docs/cli/configuration/ for more information.
extends:
  - recommended

plugins:
  - ./redocly/plugin.ts
  - ./packages/redocly-plugin-downlevel/src/index.ts

oas3_0Rules:
  parameter-description: warn
  vrchat/no-empty-description: warn
  vrchat/no-nested-object: warn
  vrchat/operation-id-convention: warn
  vrchat/schema-title: warn

oas3_1Rules:
  parameter-description: warn
  vrchat/no-empty-description: warn
  vrchat/no-nested-object: warn
  vrchat/operation-id-convention: warn
  vrchat/schema-title: warn

oas3_2Rules:
  parameter-description: warn
  vrchat/no-empty-description: warn
  vrchat/no-nested-object: warn
  vrchat/operation-id-convention: warn
  vrchat/schema-title: warn

apis:
  modern:
    root: openapi/openapi.yaml
    output: dist/openapi.json
    decorators:
      remove-x-internal: on
      vrchat/remove-x-deleted: on

  modern-internal:
    root: openapi/openapi.yaml
    output: dist/openapi-internal.json
    decorators:
      vrchat/remove-x-deleted: on

  modern-yaml:
    root: openapi/openapi.yaml
    output: dist/openapi.yaml
    decorators:
      remove-x-internal: on
      vrchat/remove-x-deleted: on

  modern-internal-yaml:
    root: openapi/openapi.yaml
    output: dist/openapi-internal.yaml
    decorators:
      vrchat/remove-x-deleted: on

  3.2:
    root: openapi/openapi.yaml
    output: dist/openapi-3.2.json
    decorators:
      remove-x-internal: on
      vrchat/remove-x-deleted: on
      downlevel/openapi:
        version: "3.2"

  3.2-internal:
    root: openapi/openapi.yaml
    output: dist/openapi-internal+3.2.json
    decorators:
      vrchat/remove-x-deleted: on
      downlevel/openapi:
        version: "3.2"

  3.2-yaml:
    root: openapi/openapi.yaml
    output: dist/openapi-3.2.yaml
    decorators:
      remove-x-internal: on
      vrchat/remove-x-deleted: on
      downlevel/openapi:
        version: "3.2"

  3.2-internal-yaml:
    root: openapi/openapi.yaml
    output: dist/openapi-internal+3.2.yaml
    decorators:
      vrchat/remove-x-deleted: on
      downlevel/openapi:
        version: "3.2"

  3.1:
    root: openapi/openapi.yaml
    output: dist/openapi-3.1.json
    decorators:
      remove-x-internal: on
      vrchat/remove-x-deleted: on
      downlevel/openapi:
        version: "3.1"

  3.1-internal:
    root: openapi/openapi.yaml
    output: dist/openapi-internal+3.1.json
    decorators:
      vrchat/remove-x-deleted: on
      downlevel/openapi:
        version: "3.1"

  3.1-yaml:
    root: openapi/openapi.yaml
    output: dist/openapi-3.1.yaml
    decorators:
      remove-x-internal: on
      vrchat/remove-x-deleted: on
      downlevel/openapi:
        version: "3.1"

  3.1-internal-yaml:
    root: openapi/openapi.yaml
    output: dist/openapi-internal+3.1.yaml
    decorators:
      vrchat/remove-x-deleted: on
      downlevel/openapi:
        version: "3.1"

  3.0:
    root: openapi/openapi.yaml
    output: dist/openapi-3.0.json
    decorators:
      remove-x-internal: on
      vrchat/remove-x-deleted: on
      downlevel/openapi:
        version: "3.0"
        loosenUnions: true

  3.0-internal:
    root: openapi/openapi.yaml
    output: dist/openapi-internal+3.0.json
    decorators:
      vrchat/remove-x-deleted: on
      downlevel/openapi:
        version: "3.0"
        loosenUnions: true

  3.0-yaml:
    root: openapi/openapi.yaml
    output: dist/openapi-3.0.yaml
    decorators:
      remove-x-internal: on
      vrchat/remove-x-deleted: on
      downlevel/openapi:
        version: "3.0"
        loosenUnions: true

  3.0-internal-yaml:
    root: openapi/openapi.yaml
    output: dist/openapi-internal+3.0.yaml
    decorators:
      vrchat/remove-x-deleted: on
      downlevel/openapi:
        version: "3.0"
        loosenUnions: true

  # Not published. The bundle the workflows run against, and what `pnpm
  # test:drift` compares the captures to — it cannot see undocumented response
  # fields while the schemas stay open.
  test:
    root: openapi/openapi.yaml
    output: dist/openapi-test.yaml
    decorators:
      vrchat/close-schemas: on
