# See https://redoc.ly/docs/cli/configuration/ for more information.
extends:
  - recommended

plugins:
  - ./redocly/plugin.ts
  - ./packages/redocly-plugin-downlevel/src/index.ts

oas3_0Rules:
  parameter-description: warn
  vrchat/no-empty-description: warn
  vrchat/no-nested-object: warn
  vrchat/operation-id-convention: warn
  vrchat/schema-title: warn

oas3_1Rules:
  parameter-description: warn
  vrchat/no-empty-description: warn
  vrchat/no-nested-object: warn
  vrchat/no-schema-example: warn
  vrchat/no-single-value-enum: warn
  vrchat/operation-id-convention: warn
  vrchat/prefer-unknown: warn
  vrchat/schema-title: warn

oas3_2Rules:
  parameter-description: warn
  vrchat/no-empty-description: warn
  vrchat/no-nested-object: warn
  vrchat/no-schema-example: warn
  vrchat/no-single-value-enum: warn
  vrchat/operation-id-convention: warn
  vrchat/prefer-unknown: warn
  vrchat/schema-title: warn

decorators:
  info-description-override:
    filePath: openapi/description.md
  vrchat/info-extension-override:
    name: x-agents
    filePath: openapi/agents.md
  vrchat/version-override: on
  vrchat/x-links:
    releases: https://github.com/vrchatapi/specification/releases
    formats: [json, yaml]
    versions: ["3.2", "3.1", "3.0"]
    documents:
      openapi: openapi-{version}
      openapi-internal: openapi-internal+{version}

apis:
  openapi.json:
    root: openapi/openapi.yaml
    output: dist/openapi.json
    decorators:
      remove-x-internal: on
      vrchat/remove-x-deleted: on

  openapi-internal.json:
    root: openapi/openapi.yaml
    output: dist/openapi-internal.json
    decorators:
      vrchat/remove-x-deleted: on

  openapi.yaml:
    root: openapi/openapi.yaml
    output: dist/openapi.yaml
    decorators:
      remove-x-internal: on
      vrchat/remove-x-deleted: on

  openapi-internal.yaml:
    root: openapi/openapi.yaml
    output: dist/openapi-internal.yaml
    decorators:
      vrchat/remove-x-deleted: on

  openapi-3.2.json:
    root: openapi/openapi.yaml
    output: dist/openapi-3.2.json
    decorators:
      remove-x-internal: on
      vrchat/remove-x-deleted: on
      downlevel/openapi:
        version: "3.2"

  "openapi-internal+3.2.json":
    root: openapi/openapi.yaml
    output: dist/openapi-internal+3.2.json
    decorators:
      vrchat/remove-x-deleted: on
      downlevel/openapi:
        version: "3.2"

  openapi-3.2.yaml:
    root: openapi/openapi.yaml
    output: dist/openapi-3.2.yaml
    decorators:
      remove-x-internal: on
      vrchat/remove-x-deleted: on
      downlevel/openapi:
        version: "3.2"

  "openapi-internal+3.2.yaml":
    root: openapi/openapi.yaml
    output: dist/openapi-internal+3.2.yaml
    decorators:
      vrchat/remove-x-deleted: on
      downlevel/openapi:
        version: "3.2"

  openapi-3.1.json:
    root: openapi/openapi.yaml
    output: dist/openapi-3.1.json
    decorators:
      remove-x-internal: on
      vrchat/remove-x-deleted: on
      downlevel/openapi:
        version: "3.1"

  "openapi-internal+3.1.json":
    root: openapi/openapi.yaml
    output: dist/openapi-internal+3.1.json
    decorators:
      vrchat/remove-x-deleted: on
      downlevel/openapi:
        version: "3.1"

  openapi-3.1.yaml:
    root: openapi/openapi.yaml
    output: dist/openapi-3.1.yaml
    decorators:
      remove-x-internal: on
      vrchat/remove-x-deleted: on
      downlevel/openapi:
        version: "3.1"

  "openapi-internal+3.1.yaml":
    root: openapi/openapi.yaml
    output: dist/openapi-internal+3.1.yaml
    decorators:
      vrchat/remove-x-deleted: on
      downlevel/openapi:
        version: "3.1"

  openapi-3.0.json:
    root: openapi/openapi.yaml
    output: dist/openapi-3.0.json
    decorators:
      remove-x-internal: on
      vrchat/remove-x-deleted: on
      downlevel/openapi:
        version: "3.0"
        loosenUnions: true

  "openapi-internal+3.0.json":
    root: openapi/openapi.yaml
    output: dist/openapi-internal+3.0.json
    decorators:
      vrchat/remove-x-deleted: on
      downlevel/openapi:
        version: "3.0"
        loosenUnions: true

  openapi-3.0.yaml:
    root: openapi/openapi.yaml
    output: dist/openapi-3.0.yaml
    decorators:
      remove-x-internal: on
      vrchat/remove-x-deleted: on
      downlevel/openapi:
        version: "3.0"
        loosenUnions: true

  "openapi-internal+3.0.yaml":
    root: openapi/openapi.yaml
    output: dist/openapi-internal+3.0.yaml
    decorators:
      vrchat/remove-x-deleted: on
      downlevel/openapi:
        version: "3.0"
        loosenUnions: true

  # Not published. The bundle the workflows run against, and what `pnpm
  # test:drift` compares the captures to — it cannot see undocumented response
  # fields while the schemas stay open.
  openapi-test.yaml:
    root: openapi/openapi.yaml
    output: dist/openapi-test.yaml
    decorators:
      vrchat/close-schemas: on
      vrchat/x-links: off
