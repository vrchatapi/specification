    parameters:
      - reference: $components.parameters.userAgent
    failureActions:
      - name: cleanup
        type: goto
        stepId: delete-group
    steps:
      - stepId: short-code
        operationId: $sourceDescriptions.local.execute
        requestBody:
          contentType: application/json
          payload:
            command: sh
            args:
              - -c
              - openssl rand -hex 2 | tr -d '\n'
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/exitCode == 0
        onFailure:
          - name: stop
            type: end

        outputs:
          value: $response.body#/stdout

      - stepId: starts-at
        operationId: $sourceDescriptions.local.execute
        requestBody:
          contentType: application/json
          payload:
            command: sh
            args:
              - -c
              - date -u -d '+3600 seconds' +%Y-%m-%dT%H:%M:%S.%3NZ | tr -d '\n'
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/exitCode == 0
        onFailure:
          - name: stop
            type: end

        outputs:
          value: $response.body#/stdout

      - stepId: ends-at
        operationId: $sourceDescriptions.local.execute
        requestBody:
          contentType: application/json
          payload:
            command: sh
            args:
              - -c
              - date -u -d '+7200 seconds' +%Y-%m-%dT%H:%M:%S.%3NZ | tr -d '\n'
        successCriteria:
