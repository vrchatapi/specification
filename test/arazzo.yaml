# yaml-language-server: $schema=https://spec.openapis.org/arazzo/1.1/schema/2026-04-15
arazzo: 1.1.0

info:
  title: VRChat API
  version: 0.0.0

sourceDescriptions:
  - name: default
    type: openapi
    url: ../dist/openapi-test.yaml

  - name: local
    type: openapi
    url: http://127.0.0.1:65482/openapi.json

components:
  parameters:
    userAgent:
      name: User-Agent
      in: header
      value: "specification-test/1 (https://vrchat.community)"

    session:
      name: Cookie
      in: header
      value: $steps.basic-auth.outputs.setCookie

workflows:

  - workflowId: login
    summary: Establish a session
    inputs:
      type: object
      required:
        - username
        - password
        - totpSecret
      properties:
        username:
          type: string
        password:
          type: string
          format: password
        totpSecret:
          type: string
          format: password
    parameters:
      - reference: $components.parameters.userAgent
    steps:
      - stepId: basic-auth
        operationId: $sourceDescriptions.default.getCurrentUser
        x-security:
          - schemeName: authHeader
            values:
              username: $inputs.username
              password: $inputs.password
        successCriteria:
          - condition: $statusCode == 200
        onFailure:
          - name: stop
            type: end

        outputs:
          setCookie: $response.header.set-cookie

      - stepId: totp-code
        operationId: $sourceDescriptions.local.execute
        requestBody:
          contentType: application/json
          payload:
            command: bun
            args:
              - -e
              - import { TOTP } from "totp-generator";
                process.stdout.write((await TOTP.generate(process.argv[1])).otp)
              - $inputs.totpSecret
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/exitCode == 0
        onFailure:
          - name: stop
            type: end

        outputs:
          code: $response.body#/stdout

      - stepId: verify-totp
        operationId: $sourceDescriptions.default.verify2FA
        parameters:
          - reference: $components.parameters.session
        requestBody:
          contentType: application/json
          payload:
            code: $steps.totp-code.outputs.code
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/verified == true

      - stepId: auth-token
        operationId: $sourceDescriptions.default.verifyAuthToken
        parameters:
          - reference: $components.parameters.session
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/ok == true
        onFailure:
          - name: stop
            type: end

        outputs:
          token: $response.body#/token

      - stepId: current-user
        operationId: $sourceDescriptions.default.getCurrentUser
        parameters:
          - reference: $components.parameters.session
        successCriteria:
          - condition: $statusCode == 200
        onFailure:
          - name: stop
            type: end

        outputs:
          userId: $response.body#/id
          displayName: $response.body#/displayName

      - stepId: cache-session
        operationId: $sourceDescriptions.local.execute
        requestBody:
          contentType: application/json
          payload:
            command: sh
            args:
              - -c
              - printf %s "$1" > test/.out/session
              - sh
              - $steps.auth-token.outputs.token
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/exitCode == 0

      - stepId: cache-user-id
        operationId: $sourceDescriptions.local.execute
        requestBody:
          contentType: application/json
          payload:
            command: sh
            args:
              - -c
              - printf %s "$1" > test/.out/user-id
              - sh
              - $steps.current-user.outputs.userId
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/exitCode == 0

      - stepId: cache-display-name
        operationId: $sourceDescriptions.local.execute
        requestBody:
          contentType: application/json
          payload:
            command: sh
            args:
              - -c
              - printf %s "$1" > test/.out/display-name
              - sh
              - $steps.current-user.outputs.displayName
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/exitCode == 0

  - workflowId: session
    summary: Read the cached session
    steps:
      - stepId: read-session
        operationId: $sourceDescriptions.local.execute
        requestBody:
          contentType: application/json
          payload:
            command: cat
            args:
              - test/.out/session
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/exitCode == 0
        outputs:
          value: $response.body#/stdout

      - stepId: read-user-id
        operationId: $sourceDescriptions.local.execute
        requestBody:
          contentType: application/json
          payload:
            command: cat
            args:
              - test/.out/user-id
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/exitCode == 0
        outputs:
          value: $response.body#/stdout

      - stepId: read-display-name
        operationId: $sourceDescriptions.local.execute
        requestBody:
          contentType: application/json
          payload:
            command: cat
            args:
              - test/.out/display-name
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/exitCode == 0
        outputs:
          value: $response.body#/stdout

      - stepId: verify
        operationId: $sourceDescriptions.default.verifyAuthToken
        parameters:
          - reference: $components.parameters.userAgent
        x-security:
          - schemeName: authCookie
            values:
              apiKey: $steps.read-session.outputs.value
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/ok == true
        onFailure:
          - name: stop
            type: end

    outputs:
      sessionToken: $steps.read-session.outputs.value
      userId: $steps.read-user-id.outputs.value
      displayName: $steps.read-display-name.outputs.value

  - workflowId: cancel-pending-2fa-unauthenticated
    summary: cancelPending2FA refuses an anonymous caller
    parameters:
      - reference: $components.parameters.userAgent
    steps:
      - stepId: cancel-pending-2fa
        operationId: $sourceDescriptions.default.cancelPending2FA
        successCriteria:
          - condition: $statusCode == 401

  - workflowId: check-user-exists-by-display-name
    summary: By display name
    inputs:
      type: object
      required:
        - username
        - email
      properties:
        username:
          type: string
        email:
          type: string
    parameters:
      - reference: $components.parameters.userAgent
    x-security:
      - schemeName: authCookie
        values:
          apiKey: $workflows.session.outputs.sessionToken
    steps:
      - stepId: by-display-name
        operationId: $sourceDescriptions.default.checkUserExists
        parameters:
          - name: displayName
            in: query
            value: $workflows.session.outputs.displayName
        successCriteria:
          - condition: $statusCode == 200 || $statusCode == 429
  - workflowId: check-user-exists-by-email
    summary: By email
    inputs:
      type: object
      required:
        - username
        - email
      properties:
        username:
          type: string
        email:
          type: string
    parameters:
      - reference: $components.parameters.userAgent
    x-security:
      - schemeName: authCookie
        values:
          apiKey: $workflows.session.outputs.sessionToken
    steps:
      - stepId: by-email
        operationId: $sourceDescriptions.default.checkUserExists
        parameters:
          - name: email
            in: query
            value: $inputs.email
        successCriteria:
          - condition: $statusCode == 200 || $statusCode == 429

  - workflowId: check-user-exists-by-username
    summary: By username
    inputs:
      type: object
      required:
        - username
        - email
      properties:
        username:
          type: string
        email:
          type: string
    parameters:
      - reference: $components.parameters.userAgent
    x-security:
      - schemeName: authCookie
        values:
          apiKey: $workflows.session.outputs.sessionToken
    steps:
      - stepId: by-username
        operationId: $sourceDescriptions.default.checkUserExists
        parameters:
          - name: username
            in: query
            value: $inputs.username
        successCriteria:
          - condition: $statusCode == 200 || $statusCode == 429

  - workflowId: check-user-exists-no-parameters
    summary: Exists no parameters
    parameters:
      - reference: $components.parameters.userAgent
    steps:
      - stepId: exists-no-parameters
        operationId: $sourceDescriptions.default.checkUserExists
        successCriteria:
          - condition: $statusCode == 400

  - workflowId: avatar-moderation-lifecycle
    summary: Block an avatar globally, confirm it is listed, then unblock it
    parameters:
      - reference: $components.parameters.userAgent
    x-security:
      - schemeName: authCookie
        values:
          apiKey: $workflows.session.outputs.sessionToken
    steps:
      - stepId: block-avatar
        operationId: $sourceDescriptions.default.createGlobalAvatarModeration
        requestBody:
          contentType: application/json
          payload:
            avatarModerationType: block
            targetAvatarId: avtr_c38a1615-5bf5-42b4-84eb-a8b6c37cbd11
        successCriteria:
          - condition: $statusCode == 200
        onFailure:
          - name: stop
            type: end

      - stepId: verify-listed
        operationId: $sourceDescriptions.default.getGlobalAvatarModerations
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/0/targetAvatarId ==
              'avtr_c38a1615-5bf5-42b4-84eb-a8b6c37cbd11'

      - stepId: unblock-avatar
        operationId: $sourceDescriptions.default.deleteGlobalAvatarModeration
        parameters:
          - name: avatarModerationType
            in: query
            value: block
          - name: targetAvatarId
            in: query
            value: avtr_c38a1615-5bf5-42b4-84eb-a8b6c37cbd11
        successCriteria:
          - condition: $statusCode == 200

  - workflowId: create-global-avatar-moderation-unauthenticated
    summary: createGlobalAvatarModeration refuses an anonymous caller
    parameters:
      - reference: $components.parameters.userAgent
    steps:
      - stepId: create-global-avatar-moderation
        operationId: $sourceDescriptions.default.createGlobalAvatarModeration
        successCriteria:
          - condition: $statusCode == 401

  - workflowId: delete-moderation-report-unauthenticated
    summary: deleteModerationReport refuses an anonymous caller
