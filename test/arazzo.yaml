  - workflowId: get-favorited-avatars-query-parameters
    summary: getFavoritedAvatars with every fillable query parameter
    parameters:
      - reference: $components.parameters.userAgent
    x-security:
      - schemeName: authCookie
        values:
          apiKey: $workflows.session.outputs.sessionToken
    steps:
      - stepId: get-favorited-avatars
        operationId: $sourceDescriptions.default.getFavoritedAvatars
        parameters:
          - name: featured
            in: query
            value: false
          - name: n
            in: query
            value: 1
          - name: offset
