        parameters:
          - name: moderationReportId
            in: path
            value: mrep_00000000-0000-0000-0000-000000000000
        successCriteria:
          - condition: $statusCode == 401

  - workflowId: delete-user-unauthenticated
    summary: deleteUser refuses an anonymous caller
