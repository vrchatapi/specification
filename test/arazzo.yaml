  - workflowId: profile-update-restore
    summary: Update the writable profile fields, confirm they applied, restore them
    parameters:
      - reference: $components.parameters.userAgent
    steps:
      - stepId: marker
        operationId: $sourceDescriptions.local.execute
        requestBody:
          contentType: application/json
          payload:
            command: sh
            args:
              - -c
              - openssl rand -hex 6 | tr -d '\n'
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/exitCode == 0
        onFailure:
          - name: stop
            type: end

        outputs:
          value: $response.body#/stdout

      - stepId: current-before
        x-security:
          - schemeName: authCookie
            values:
              apiKey: $workflows.session.outputs.sessionToken
        operationId: $sourceDescriptions.default.getCurrentUser
        successCriteria:
          - condition: $statusCode == 200
        onFailure:
          - name: stop
            type: end

        outputs:
          bioLinks: $response.body#/bioLinks
          pronouns: $response.body#/pronouns
          status: $response.body#/status
          statusDescription: $response.body#/statusDescription
          isBoopingEnabled: $response.body#/isBoopingEnabled
          unsubscribe: $response.body#/unsubscribe

      - stepId: update-profile
        x-security:
          - schemeName: authCookie
            values:
              apiKey: $workflows.session.outputs.sessionToken
        operationId: $sourceDescriptions.default.updateUser
        parameters:
          - name: userId
            in: path
            value: $workflows.session.outputs.userId
        requestBody:
          contentType: application/json
          payload:
            bio: $steps.marker.outputs.value
            statusDescription: $steps.marker.outputs.value
            pronouns: they/them
            status: active
            bioLinks: $steps.current-before.outputs.bioLinks
            isBoopingEnabled: $steps.current-before.outputs.isBoopingEnabled
            unsubscribe: $steps.current-before.outputs.unsubscribe
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/bio == $steps.marker.outputs.value
          - condition: $response.body#/statusDescription == $steps.marker.outputs.value
          - condition: $response.body#/pronouns == 'they/them'
          - condition: $response.body#/status == 'active'

      - stepId: verify-current-user
        x-security:
          - schemeName: authCookie
            values:
              apiKey: $workflows.session.outputs.sessionToken
        operationId: $sourceDescriptions.default.getCurrentUser
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/bio == $steps.marker.outputs.value

      - stepId: verify-get-user
        x-security:
          - schemeName: authCookie
            values:
              apiKey: $workflows.session.outputs.sessionToken
        operationId: $sourceDescriptions.default.getUser
        parameters:
          - name: userId
            in: path
            value: $workflows.session.outputs.userId
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/bio == $steps.marker.outputs.value

      - stepId: restore-profile
        x-security:
          - schemeName: authCookie
            values:
              apiKey: $workflows.session.outputs.sessionToken
        operationId: $sourceDescriptions.default.updateUser
        parameters:
          - name: userId
            in: path
            value: $workflows.session.outputs.userId
        requestBody:
          contentType: application/json
          payload:
            bio: ""
            statusDescription: $steps.current-before.outputs.statusDescription
            pronouns: $steps.current-before.outputs.pronouns
            status: $steps.current-before.outputs.status
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/bio == ''
          - condition: $response.body#/pronouns == $steps.current-before.outputs.pronouns
          - condition: $response.body#/status == $steps.current-before.outputs.status

      - stepId: verify-restored
        x-security:
          - schemeName: authCookie
            values:
              apiKey: $workflows.session.outputs.sessionToken
        operationId: $sourceDescriptions.default.getUser
        parameters:
          - name: userId
            in: path
            value: $workflows.session.outputs.userId
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/bio == ''

