    steps:
      - stepId: enqueue-impostor
        operationId: $sourceDescriptions.default.enqueueImpostor
        parameters:
          - name: avatarId
            in: path
            value: avtr_00000000-0000-0000-0000-000000000000
        successCriteria:
          - condition: $statusCode == 401

  - workflowId: get-avatar-not-found
    summary: getAvatar refuses a resource that does not exist
    parameters:
      - reference: $components.parameters.userAgent
    x-security:
      - schemeName: authCookie
        values:
