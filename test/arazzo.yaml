  - workflowId: calendar-event-lifecycle
    summary: Create a calendar event on an owned group, read it, update it, delete it
    parameters:
      - reference: $components.parameters.userAgent
    steps:
      - stepId: starts-at
        operationId: $sourceDescriptions.local.execute
        requestBody:
          contentType: application/json
          payload:
            command: sh
            args:
              - -c
              - date -u -d '+3600 seconds' +%Y-%m-%dT%H:%M:%S.%3NZ | tr -d '\n'
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/exitCode == 0
        onFailure:
          - name: stop
            type: end

        outputs:
          value: $response.body#/stdout

      - stepId: ends-at
        operationId: $sourceDescriptions.local.execute
        requestBody:
          contentType: application/json
          payload:
            command: sh
            args:
              - -c
              - date -u -d '+7200 seconds' +%Y-%m-%dT%H:%M:%S.%3NZ | tr -d '\n'
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/exitCode == 0
        onFailure:
          - name: stop
            type: end

        outputs:
          value: $response.body#/stdout

      - stepId: own-groups
        x-security:
          - schemeName: authCookie
            values:
              apiKey: $workflows.session.outputs.sessionToken
        operationId: $sourceDescriptions.default.getUserGroups
        parameters:
          - name: userId
            in: path
            value: $workflows.session.outputs.userId
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/0/groupId != null
        onFailure:
          - name: stop
            type: end

        outputs:
          groupId: $response.body#/0/groupId

      - stepId: create-event
        x-security:
          - schemeName: authCookie
            values:
              apiKey: $workflows.session.outputs.sessionToken
        operationId: $sourceDescriptions.default.createGroupCalendarEvent
        parameters:
          - name: groupId
            in: path
            value: $steps.own-groups.outputs.groupId
        requestBody:
          contentType: application/json
          payload:
            accessType: group
            category: other
            description: Created by the test suite
            title: Test
            sendCreationNotification: false
            startsAt: $steps.starts-at.outputs.value
            endsAt: $steps.ends-at.outputs.value
        successCriteria:
          - condition: $statusCode == 200
        onFailure:
          - name: stop
            type: end

        outputs:
          calendarId: $response.body#/id

      - stepId: get-event
        x-security:
          - schemeName: authCookie
            values:
              apiKey: $workflows.session.outputs.sessionToken
        operationId: $sourceDescriptions.default.getGroupCalendarEvent
        parameters:
          - name: groupId
            in: path
            value: $steps.own-groups.outputs.groupId
          - name: calendarId
            in: path
            value: $steps.create-event.outputs.calendarId
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/title == 'Test'

      - stepId: update-event
        x-security:
          - schemeName: authCookie
            values:
              apiKey: $workflows.session.outputs.sessionToken
        operationId: $sourceDescriptions.default.updateGroupCalendarEvent
        parameters:
          - name: groupId
            in: path
            value: $steps.own-groups.outputs.groupId
          - name: calendarId
            in: path
            value: $steps.create-event.outputs.calendarId
        requestBody:
          contentType: application/json
          payload:
            title: Test renamed
            description: Updated by the test suite
        successCriteria:
          - condition: $statusCode == 200

      - stepId: delete-event
        x-security:
          - schemeName: authCookie
            values:
              apiKey: $workflows.session.outputs.sessionToken
        operationId: $sourceDescriptions.default.deleteGroupCalendarEvent
        parameters:
          - name: groupId
            in: path
            value: $steps.own-groups.outputs.groupId
          - name: calendarId
            in: path
            value: $steps.create-event.outputs.calendarId
        successCriteria:
          - condition: $statusCode == 200

