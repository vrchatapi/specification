          apiKey: $workflows.session.outputs.sessionToken
    steps:
      - stepId: moderation-reports
        operationId: $sourceDescriptions.default.getModerationReports
        successCriteria:
          - condition: $statusCode == 200

  - workflowId: get-moderation-reports-query-parameters
    summary: getModerationReports with every fillable query parameter
    parameters:
      - reference: $components.parameters.userAgent
    x-security:
      - schemeName: authCookie
        values:
          apiKey: $workflows.session.outputs.sessionToken
    steps:
      - stepId: get-moderation-reports
        operationId: $sourceDescriptions.default.getModerationReports
        parameters:
          - name: n
            in: query
            value: 1
          - name: offset
            in: query
            value: 1
        successCriteria:
          - condition: $statusCode == 200

  - workflowId: get-moderation-reports-unauthenticated
    summary: getModerationReports refuses an anonymous caller
    parameters:
      - reference: $components.parameters.userAgent
    steps:
      - stepId: get-moderation-reports
        operationId: $sourceDescriptions.default.getModerationReports
        successCriteria:
          - condition: $statusCode == 401

  - workflowId: get-o-auth-redirect-code
    summary: Oauth redirect code
    parameters:
      - reference: $components.parameters.userAgent
    x-security:
      - schemeName: authCookie
        values:
          apiKey: $workflows.session.outputs.sessionToken
    steps:
      - stepId: oauth-redirect-code
        operationId: $sourceDescriptions.default.getOAuthRedirectCode
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/code != null

  - workflowId: get-recovery-codes-unauthenticated
    summary: getRecoveryCodes refuses an anonymous caller
    parameters:
      - reference: $components.parameters.userAgent
    steps:
      - stepId: get-recovery-codes
        operationId: $sourceDescriptions.default.getRecoveryCodes
        successCriteria:
          - condition: $statusCode == 401

  - workflowId: get-sso-token-canny
    summary: SSO token for Canny
    parameters:
      - reference: $components.parameters.userAgent
    x-security:
      - schemeName: authCookie
        values:
          apiKey: $workflows.session.outputs.sessionToken
    steps:
      - stepId: sso-canny
        operationId: $sourceDescriptions.default.getSsoToken
        parameters:
          - name: provider
            in: path
            value: canny
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/token != null

  - workflowId: get-sso-token-furality
