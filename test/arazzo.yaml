  - workflowId: verify-2fa-unauthenticated
    summary: verify2FA refuses an anonymous caller
    parameters:
      - reference: $components.parameters.userAgent
    steps:
      - stepId: verify-2fa
        operationId: $sourceDescriptions.default.verify2FA
        successCriteria:
