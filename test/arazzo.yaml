    parameters:
      - reference: $components.parameters.userAgent
    x-security:
      - schemeName: authCookie
        values:
          apiKey: $workflows.session.outputs.sessionToken
    steps:
      - stepId: sso-furality
        operationId: $sourceDescriptions.default.getSsoToken
        parameters:
          - name: provider
            in: path
            value: furality
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/token != null

  - workflowId: get-sso-token-unsupported
    summary: SSO token for an unsupported provider is refused
    parameters:
      - reference: $components.parameters.userAgent
    x-security:
      - schemeName: authCookie
        values:
          apiKey: $workflows.session.outputs.sessionToken
    steps:
      - stepId: sso-unsupported
        operationId: $sourceDescriptions.default.getSsoToken
        parameters:
          - name: provider
            in: path
            value: test
        successCriteria:
          - condition: $statusCode == 400
  - workflowId: logout
    summary: >-
      Invalidates the session, so `pnpm test` skips it by name — running
      it would break the cached token every later workflow depends on. Drive it
      directly when you want to exercise logout.
    parameters:
      - reference: $components.parameters.userAgent
    x-security:
      - schemeName: authCookie
        values:
          apiKey: $workflows.session.outputs.sessionToken
    steps:
      - stepId: logout
        operationId: $sourceDescriptions.default.logout
        successCriteria:
          - condition: $statusCode == 200

      - stepId: current-user-after-logout
        operationId: $sourceDescriptions.default.getCurrentUser
        successCriteria:
          - condition: $statusCode == 401

  - workflowId: logout-unauthenticated
