          contentType: application/json
          payload:
            name: Test
            roleTemplate: default
            shortCode: $steps.short-code.outputs.value
            description: Created by the test suite
            joinState: closed
            privacy: default
            bannerId: null
            iconId: null
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/name == 'Test'
          - condition: $response.body#/description == 'Created by the test suite'
          - condition: $response.body#/privacy == 'default'
        onFailure:
          - name: stop
            type: end

        outputs:
