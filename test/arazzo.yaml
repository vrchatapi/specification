            value: $workflows.session.outputs.userId
        successCriteria:
          - condition: $statusCode == 200
          - context: $response.body#/tags
            condition: ^(?!.*language_kor).*$
            type: regex
        onFailure:
          - name: stop
            type: end

      - stepId: add-tag
