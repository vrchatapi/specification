    x-security:
      - schemeName: authCookie
        values:
          apiKey: $workflows.session.outputs.sessionToken
    steps:
      - stepId: delete-impostor
        operationId: $sourceDescriptions.default.deleteImpostor
        parameters:
          - name: avatarId
            in: path
            value: avtr_3f2a9c14-8d7b-4e05-a6c3-1b9e5d0f7a82
        successCriteria:
          - condition: $statusCode == 404

  - workflowId: delete-impostor-unauthenticated
    summary: deleteImpostor refuses an anonymous caller
    parameters:
      - reference: $components.parameters.userAgent
    steps:
      - stepId: delete-impostor
        operationId: $sourceDescriptions.default.deleteImpostor
        parameters:
