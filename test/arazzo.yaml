  - workflowId: group-lifecycle
    summary: Creates, updates and deletes a real group on the account
    inputs:
      type: object
      required:
        - friendId
      properties:
        friendId:
          type: string
    parameters:
      - reference: $components.parameters.userAgent
    failureActions:
      - name: cleanup
        type: goto
        stepId: delete-group
    steps:
      - stepId: short-code
        operationId: $sourceDescriptions.local.execute
        requestBody:
          contentType: application/json
          payload:
            command: sh
            args:
              - -c
              - openssl rand -hex 2 | tr -d '\n'
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/exitCode == 0
        onFailure:
          - name: stop
            type: end

        outputs:
          value: $response.body#/stdout

      - stepId: create-group
        x-security:
